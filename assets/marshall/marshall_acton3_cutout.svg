<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <filter id="actShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
    <linearGradient id="actTolex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="15%" stop-color="#1a1a1a"/>
      <stop offset="85%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="actBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92621f"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fce289"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5015"/>
    </linearGradient>
    <pattern id="actGrille" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#161616"/>
      <line x1="0" y1="0" x2="7" y2="7" stroke="#333333" stroke-width="1.1"/>
      <line x1="7" y1="0" x2="0" y2="7" stroke="#242424" stroke-width="1.1"/>
      <circle cx="3.5" cy="3.5" r="0.9" fill="#bfa15f" opacity="0.22"/>
    </pattern>
  </defs>

  <g filter="url(#actShadow)">
    <rect x="80" y="60" width="440" height="310" rx="18" fill="url(#actTolex)" stroke="#3a3a3a" stroke-width="2"/>
    <rect x="98" y="78" width="404" height="274" rx="10" fill="#141414" stroke="url(#actBrass)" stroke-width="2"/>
    <rect x="101" y="81" width="398" height="268" rx="8" fill="url(#actGrille)"/>

    <rect x="101" y="329" width="398" height="20" rx="2" fill="url(#actBrass)"/>
    <text x="300" y="343" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#181818" letter-spacing="3">EST. 1962</text>

    <text x="300" y="225" font-family="'Brush Script MT', 'Great Vibes', cursive, sans-serif" font-style="italic" font-size="62" font-weight="900" text-anchor="middle" fill="#fcfcfc" letter-spacing="2" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))">Marshall</text>

    <rect x="190" y="62" width="220" height="13" rx="3" fill="url(#actBrass)"/>
    <circle cx="235" cy="68" r="5" fill="#1a1a1a" stroke="url(#actBrass)" stroke-width="1"/>
    <circle cx="275" cy="68" r="5" fill="#1a1a1a" stroke="url(#actBrass)" stroke-width="1"/>
    <circle cx="315" cy="68" r="5" fill="#1a1a1a" stroke="url(#actBrass)" stroke-width="1"/>
    <circle cx="355" cy="68" r="5" fill="#1a1a1a" stroke="url(#actBrass)" stroke-width="1"/>

    <rect x="115" y="370" width="38" height="10" rx="3" fill="#111"/>
    <rect x="445" y="370" width="38" height="10" rx="3" fill="#111"/>
  </g>
</svg>