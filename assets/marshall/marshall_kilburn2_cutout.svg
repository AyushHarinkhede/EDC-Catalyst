<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <filter id="kilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
    <linearGradient id="kilCabinet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="25%" stop-color="#181818"/>
      <stop offset="85%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="kilStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#7f1d1d"/>
      <stop offset="70%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="kilBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <pattern id="kilMesh" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#141414"/>
      <line x1="0" y1="0" x2="7" y2="7" stroke="#333333" stroke-width="1.2"/>
      <line x1="7" y1="0" x2="0" y2="7" stroke="#262626" stroke-width="1.2"/>
    </pattern>
  </defs>

  <g filter="url(#kilShadow)">
    <!-- Red Velvet-lined Black Leather Carrying Strap Arching Overhead -->
    <path d="M120,150 C120,30 480,30 480,150" fill="none" stroke="url(#kilStrap)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="120" cy="150" r="10" fill="url(#kilBrass)" stroke="#111" stroke-width="2"/>
    <circle cx="480" cy="150" r="10" fill="url(#kilBrass)" stroke="#111" stroke-width="2"/>

    <!-- Cabinet Body -->
    <rect x="75" y="110" width="450" height="290" rx="22" fill="url(#kilCabinet)" stroke="#383838" stroke-width="2"/>

    <!-- Flush Corner Caps -->
    <path d="M75,135 Q75,110 100,110 L94,125 Q86,128 84,135 Z" fill="#262626"/>
    <path d="M525,135 Q525,110 500,110 L506,125 Q514,128 516,135 Z" fill="#262626"/>
    <path d="M75,375 Q75,400 100,400 L94,385 Q86,382 84,375 Z" fill="#262626"/>
    <path d="M525,375 Q525,400 500,400 L506,385 Q514,382 516,375 Z" fill="#262626"/>

    <!-- Front Amp Grille -->
    <rect x="98" y="132" width="404" height="246" rx="14" fill="url(#kilMesh)" stroke="#222" stroke-width="2"/>

    <!-- Classic Marshall White Script Logo -->
    <text x="300" y="270" font-family="'Brush Script MT', 'Great Vibes', cursive, sans-serif" font-style="italic" font-size="64" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="2" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.9))">Marshall</text>

    <!-- Top Recessed Analog Plate with Volume, Bass, Treble knobs -->
    <rect x="210" y="108" width="180" height="12" rx="3" fill="#1f1f1f" stroke="url(#kilBrass)" stroke-width="1"/>
    <circle cx="245" cy="114" r="5" fill="url(#kilBrass)"/>
    <circle cx="300" cy="114" r="5" fill="url(#kilBrass)"/>
    <circle cx="355" cy="114" r="5" fill="url(#kilBrass)"/>

    <!-- Rubber Feet -->
    <rect x="110" y="400" width="40" height="10" rx="3" fill="#111"/>
    <rect x="450" y="400" width="40" height="10" rx="3" fill="#111"/>
  </g>
</svg>