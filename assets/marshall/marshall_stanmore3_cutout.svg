    </g>

    <!-- Top Recessed Brass Analog Control Panel -->
    <rect x="180" y="52" width="280" height="15" rx="3" fill="url(#brassGleam)"/>
    <!-- Knobs peeking from top panel -->
    <circle cx="230" cy="59" r="6" fill="#1a1a1a" stroke="url(#brassGleam)" stroke-width="1.5"/>
    <circle cx="280" cy="59" r="6" fill="#1a1a1a" stroke="url(#brassGleam)" stroke-width="1.5"/>
    <circle cx="330" cy="59" r="6" fill="#1a1a1a" stroke="url(#brassGleam)" stroke-width="1.5"/>
    <circle cx="380" cy="59" r="6" fill="#1a1a1a" stroke="url(#brassGleam)" stroke-width="1.5"/>
    <!-- Power Toggle Switch -->
    <rect x="420" y="54" width="14" height="10" rx="2" fill="#d4af37" stroke="#111" stroke-width="1"/>

    <!-- Rubber Feet -->
    <rect x="100" y="390" width="45" height="12" rx="4" fill="#111111"/>
    <rect x="495" y="390" width="45" height="12" rx="4" fill="#111111"/>
  </g>
</svg>