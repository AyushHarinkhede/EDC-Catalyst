<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%">
  <defs>
    <filter id="motShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
    <linearGradient id="caseTolex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="40%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="motGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <g filter="url(#motShadow)">
    <!-- Pocketable Textured Amp Charging Case -->
    <rect x="170" y="160" width="180" height="230" rx="36" fill="url(#caseTolex)" stroke="#383838" stroke-width="2"/>
    <line x1="170" y1="230" x2="350" y2="230" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- White Marshall Script Logo on Case Lid -->
    <text x="260" y="208" font-family="'Brush Script MT', cursive, sans-serif" font-style="italic" font-size="28" font-weight="900" text-anchor="middle" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">Marshall</text>

    <!-- Golden LED charging status indicator & pair button -->
    <circle cx="260" cy="355" r="3.5" fill="url(#motGold)"/>
    <rect x="250" y="325" width="20" height="5" rx="2" fill="#222" stroke="#444" stroke-width="1"/>

    <!-- LEFT EARBUD (Knurled Amp Knurling Stem + 'M' script) -->
    <g transform="translate(100, 110)">
      <!-- Angled In-Ear Head -->
      <ellipse cx="45" cy="40" rx="22" ry="18" fill="#1c1c1c" stroke="#333" stroke-width="1.5"/>
      <circle cx="36" cy="40" r="10" fill="#090909"/>
      <!-- Knurled Stem -->
      <rect x="40" y="52" width="14" height="60" rx="6" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="40" y1="65" x2="54" y2="65" stroke="#333" stroke-width="1"/>
      <line x1="40" y1="75" x2="54" y2="75" stroke="#333" stroke-width="1"/>
      <line x1="40" y1="85" x2="54" y2="85" stroke="#333" stroke-width="1"/>
      <line x1="40" y1="95" x2="54" y2="95" stroke="#333" stroke-width="1"/>
      <!-- Gold Stem End Cap -->
      <rect x="40" y="106" width="14" height="6" rx="2" fill="url(#motGold)"/>
      <!-- Signature 'M' Logo on touch surface -->
      <text x="47" y="47" font-family="'Brush Script MT', cursive, sans-serif" font-style="italic" font-size="16" font-weight="900" text-anchor="middle" fill="#ffffff">M</text>
    </g>

    <!-- RIGHT EARBUD -->
    <g transform="translate(350, 110)">
      <!-- Angled In-Ear Head -->
      <ellipse cx="25" cy="40" rx="22" ry="18" fill="#1c1c1c" stroke="#333" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="10" fill="#090909"/>
      <!-- Knurled Stem -->
      <rect x="16" y="52" width="14" height="60" rx="6" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
      <line x1="16" y1="65" x2="30" y2="65" stroke="#333" stroke-width="1"/>
      <line x1="16" y1="75" x2="30" y2="75" stroke="#333" stroke-width="1"/>
      <line x1="16" y1="85" x2="30" y2="85" stroke="#333" stroke-width="1"/>
      <line x1="16" y1="95" x2="30" y2="95" stroke="#333" stroke-width="1"/>
      <!-- Gold Stem End Cap -->
      <rect x="16" y="106" width="14" height="6" rx="2" fill="url(#motGold)"/>
      <!-- Signature 'M' Logo -->
      <text x="23" y="47" font-family="'Brush Script MT', cursive, sans-serif" font-style="italic" font-size="16" font-weight="900" text-anchor="middle" fill="#ffffff">M</text>
    </g>
  </g>
</svg>