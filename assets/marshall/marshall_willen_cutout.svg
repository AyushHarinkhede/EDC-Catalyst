<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="100%" height="100%">
  <defs>
    <filter id="wilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="wilBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="30%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="wilBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <pattern id="wilGrille" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#141414"/>
      <circle cx="2.5" cy="2.5" r="1.5" fill="#303030"/>
    </pattern>
  </defs>

  <g filter="url(#wilShadow)">
    <!-- Square Rugged Body -->
    <rect x="90" y="90" width="280" height="280" rx="36" fill="url(#wilBody)" stroke="#3d3d3d" stroke-width="2"/>

    <!-- Inset Grille -->
    <rect x="115" y="115" width="230" height="230" rx="22" fill="url(#wilGrille)" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Golden Script Logo (Center) -->
    <text x="230" y="245" font-family="'Brush Script MT', 'Great Vibes', cursive, sans-serif" font-style="italic" font-size="44" font-weight="900" text-anchor="middle" fill="url(#wilBrass)" letter-spacing="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.85))">Marshall</text>

    <!-- Top-Right Multi-Directional Brass Knob -->
    <circle cx="318" cy="142" r="15" fill="url(#wilBrass)" stroke="#111" stroke-width="1.5"/>
    <circle cx="318" cy="142" r="10" fill="#181818"/>
    <circle cx="318" cy="142" r="3" fill="url(#wilBrass)"/>

    <!-- Top Rubber Strap Anchor / Microphone hole -->
    <rect x="135" y="92" width="28" height="6" rx="3" fill="#111111"/>
    <circle cx="180" cy="95" r="2.5" fill="#ca8a04"/>
  </g>
</svg>