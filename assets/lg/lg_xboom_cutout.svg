<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="100%" height="100%">
  <defs>
    <filter id="xboomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="xboomBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGlowRgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <g filter="url(#xboomShadow)">
    <!-- Top Carry Handle -->
    <path d="M 170,95 C 170,60 280,60 280,95 Z" fill="none" stroke="#e11d48" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Main Tower Speaker Enclosure -->
    <rect x="130" y="90" width="190" height="380" rx="26" fill="url(#xboomBody)" stroke="#334155" stroke-width="2.5"/>

    <!-- Dual 2.5-Inch Dome Tweeters (Top) -->
    <circle cx="175" cy="140" r="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="275" cy="140" r="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- Giant 8-Inch Giant Woofer with Multicolored RGB Ring Lighting -->
    <circle cx="225" cy="285" r="72" fill="none" stroke="url(#ringGlowRgb)" stroke-width="8" filter="drop-shadow(0 0 10px #ec4899)"/>
    <circle cx="225" cy="285" r="64" fill="#020617" stroke="#334155" stroke-width="2"/>
    <circle cx="225" cy="285" r="32" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
    <circle cx="225" cy="285" r="16" fill="#0f172a"/>

    <!-- Pixel LED Animation Display (Between Tweeters & Woofer) -->
    <rect x="180" y="180" width="90" height="24" rx="4" fill="#020617" stroke="#334155" stroke-width="1"/>
    <text x="225" y="196" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#ec4899" text-anchor="middle">XBOOM</text>

    <!-- Bottom Telescopic Luggage Wheels & Stand -->
    <circle cx="150" cy="475" r="14" fill="#334155" stroke="#0f172a" stroke-width="3"/>
    <circle cx="300" cy="475" r="14" fill="#334155" stroke="#0f172a" stroke-width="3"/>
  </g>
</svg>