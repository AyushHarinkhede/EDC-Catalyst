<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="100%" height="100%">
  <defs>
    <filter id="puriShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#puriShadow)">
    <!-- Lower Cylindrical Air Intake Tower -->
    <rect x="150" y="370" width="150" height="230" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- 360 Degree Micro Perforations -->
    <g fill="#94a3b8" opacity="0.6">
      <circle cx="170" cy="420" r="2"/><circle cx="190" cy="420" r="2"/><circle cx="210" cy="420" r="2"/><circle cx="230" cy="420" r="2"/><circle cx="250" cy="420" r="2"/><circle cx="270" cy="420" r="2"/>
      <circle cx="170" cy="470" r="2"/><circle cx="190" cy="470" r="2"/><circle cx="210" cy="470" r="2"/><circle cx="230" cy="470" r="2"/><circle cx="250" cy="470" r="2"/><circle cx="270" cy="470" r="2"/>
      <circle cx="170" cy="520" r="2"/><circle cx="190" cy="520" r="2"/><circle cx="210" cy="520" r="2"/><circle cx="230" cy="520" r="2"/><circle cx="250" cy="520" r="2"/><circle cx="270" cy="520" r="2"/>
    </g>

    <!-- Upper Cylindrical Tower -->
    <rect x="155" y="190" width="140" height="170" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <g fill="#94a3b8" opacity="0.6">
      <circle cx="175" cy="240" r="2"/><circle cx="195" cy="240" r="2"/><circle cx="215" cy="240" r="2"/><circle cx="235" cy="240" r="2"/><circle cx="255" cy="240" r="2"/><circle cx="275" cy="240" r="2"/>
      <circle cx="175" cy="290" r="2"/><circle cx="195" cy="290" r="2"/><circle cx="215" cy="290" r="2"/><circle cx="235" cy="290" r="2"/><circle cx="255" cy="290" r="2"/><circle cx="275" cy="290" r="2"/>
    </g>

    <!-- The Famous Pop-Up Clean Booster Fan (Tilted at Top to propel air) -->
    <g transform="translate(145, 95) rotate(-18, 80, 50)">
      <ellipse cx="80" cy="50" rx="75" ry="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="80" cy="50" r="20" fill="#22c55e"/> <!-- Clean air indicator ring -->
      <!-- Multi-blade propeller fan -->
      <line x1="80" y1="25" x2="80" y2="75" stroke="#64748b" stroke-width="3"/>
      <line x1="55" y1="50" x2="105" y2="50" stroke="#64748b" stroke-width="3"/>
    </g>
  </g>
</svg>