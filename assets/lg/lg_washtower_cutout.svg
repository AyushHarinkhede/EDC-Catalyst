<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 700" width="100%" height="100%">
  <defs>
    <filter id="towerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="washTowerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#0f3d21"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <g filter="url(#towerShadow)">
    <!-- Full Tower Enclosure -->
    <rect x="100" y="40" width="250" height="620" rx="20" fill="url(#washTowerGreen)" stroke="#166534" stroke-width="2.5"/>

    <!-- UPPER UNIT: Dryer with Tempered Glass Door -->
    <circle cx="225" cy="180" r="95" fill="#020617" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="225" cy="180" r="82" fill="#0f172a"/>
    <circle cx="225" cy="180" r="55" fill="#14532d" opacity="0.4"/>

    <!-- UNIFIED CENTER CONTROL PANEL (Perfect Ergonomic Height) -->
    <rect x="108" y="305" width="234" height="60" rx="6" fill="#020617" stroke="#166534" stroke-width="1.5"/>
    <text x="160" y="335" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#38bdf8">DRYER</text>
    <text x="160" y="352" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#22c55e">0:45</text>
    
    <line x1="225" y1="315" x2="225" y2="355" stroke="#334155" stroke-width="1.5"/>

    <text x="290" y="335" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="end">WASHER</text>
    <text x="290" y="352" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#22c55e" text-anchor="end">0:52</text>

    <!-- LOWER UNIT: Washer with Tempered Glass Door -->
    <circle cx="225" cy="495" r="95" fill="#020617" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="225" cy="495" r="82" fill="#0f172a"/>
    <circle cx="225" cy="495" r="55" fill="#14532d" opacity="0.4"/>
  </g>
</svg>