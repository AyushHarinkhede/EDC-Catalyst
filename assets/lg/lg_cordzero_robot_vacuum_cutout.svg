<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <filter id="lgRobotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#lgRobotShadow)">
    <!-- Rounded Chassis with Metallic Trim -->
    <circle cx="250" cy="210" r="150" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <circle cx="250" cy="210" r="135" fill="#0f172a"/>

    <!-- Dual 3D Vision Cameras on Front Bumper -->
    <rect x="190" y="65" width="120" height="30" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <circle cx="225" cy="80" r="8" fill="#38bdf8"/>
    <circle cx="275" cy="80" r="8" fill="#38bdf8"/>

    <!-- Center LiDAR Sensor Turret -->
    <circle cx="250" cy="180" r="42" fill="#334155" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="250" cy="180" r="26" fill="#020617"/>
    <rect x="246" y="160" width="8" height="40" rx="2" fill="#ef4444"/>

    <!-- Touch Control Buttons -->
    <circle cx="250" cy="275" r="14" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#94a3b8" letter-spacing="2" text-anchor="middle">CordZero</text>
  </g>
</svg>