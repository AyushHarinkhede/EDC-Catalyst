<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <defs>
    <filter id="sbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="soundbarMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g filter="url(#sbShadow)">
    <!-- Wireless Subwoofer (Left) -->
    <rect x="60" y="80" width="110" height="230" rx="14" fill="url(#soundbarMetal)" stroke="#475569" stroke-width="2"/>
    <circle cx="115" cy="190" r="42" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="115" cy="190" r="26" fill="#020617"/>
    <ellipse cx="115" cy="275" rx="16" ry="6" fill="#020617"/> <!-- Bass reflex port -->

    <!-- Sleek Main Soundbar Unit (Horizontal) -->
    <rect x="200" y="240" width="410" height="65" rx="12" fill="url(#soundbarMetal)" stroke="#475569" stroke-width="2"/>
    
    <!-- Acoustic Front Grille Mesh -->
    <rect x="205" y="245" width="400" height="55" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Triple Up-Firing Dolby Atmos Height Channels (Top of bar) -->
    <ellipse cx="260" cy="245" rx="18" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <ellipse cx="405" cy="245" rx="22" ry="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/> <!-- Center Up-Firing -->
    <ellipse cx="550" cy="245" rx="18" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- OLED Dot-Matrix Status Indicator: "DOLBY ATMOS" -->
    <text x="405" y="278" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">DOLBY ATMOS</text>
  </g>
</svg>