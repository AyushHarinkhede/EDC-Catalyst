<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <filter id="washerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="washerMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <g filter="url(#washerShadow)">
    <!-- Machine Chassis -->
    <rect x="100" y="60" width="300" height="420" rx="18" fill="url(#washerMetal)" stroke="#64748b" stroke-width="2.5"/>

    <!-- Top Control Console Panel -->
    <rect x="110" y="75" width="280" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Detergent Dispenser Drawer (Left) -->
    <rect x="120" y="85" width="60" height="50" rx="4" fill="#1e293b"/>
    
    <!-- Center Metallic Dial with LED Cycle Selector -->
    <circle cx="250" cy="110" r="22" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="250" cy="110" r="14" fill="#475569"/>
    <circle cx="250" cy="94" r="2.5" fill="#e11d48"/> <!-- Red selection indicator -->

    <!-- Right Touch LED Display Panel -->
    <rect x="300" y="88" width="80" height="44" rx="4" fill="#020617"/>
    <text x="340" y="112" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">0:59</text>
    <text x="340" y="125" font-family="'Courier New', monospace" font-size="7.5" fill="#22c55e" text-anchor="middle">AI DD ACTIVE</text>

    <!-- Large Tinted Tempered Glass Door with Chrome Rim -->
    <circle cx="250" cy="300" r="125" fill="#020617" stroke="#cbd5e1" stroke-width="5"/>
    <circle cx="250" cy="300" r="112" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- Inner Stainless Steel Drum with Lifters -->
    <circle cx="250" cy="300" r="85" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <ellipse cx="250" cy="300" rx="60" ry="60" fill="#0f172a"/>
    <circle cx="250" cy="300" r="25" fill="#38bdf8" opacity="0.3"/>

    <!-- Bottom Filter Access Flap -->
    <rect x="330" y="435" width="45" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  </g>
</svg>