<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="100%" height="100%">
  <defs>
    <filter id="roShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#roShadow)">
    <!-- Water Purifier Cabinet -->
    <rect x="110" y="70" width="230" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Front Glossy Accent Panel (Dark Wine Red / Floral LG Accent) -->
    <rect x="125" y="85" width="200" height="230" rx="12" fill="#881337" stroke="#4c0519" stroke-width="1.5"/>
    <!-- Subtle Botanical Wave Pattern -->
    <path d="M 140,240 Q 200,160 250,230 T 320,190" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>

    <!-- Dual Stainless Steel Water Tank Indicator Display -->
    <circle cx="225" cy="150" r="28" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="225" y="155" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">8L</text>

    <!-- Water Dispensing Chrome Faucet Tap Spout -->
    <path d="M 225,320 L 225,360 L 210,370" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="210" cy="370" r="4" fill="#38bdf8"/>

    <!-- Bottom Drip Tray -->
    <rect x="135" y="440" width="180" height="35" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="150" y1="452" x2="300" y2="452" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>