<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <filter id="fridgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="lgStainless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="instaViewGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g filter="url(#fridgeShadow)">
    <!-- Main French Door Refrigerator Cabinet -->
    <rect x="110" y="60" width="280" height="520" rx="16" fill="url(#lgStainless)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Center French Door Vertical Seam -->
    <line x1="250" y1="65" x2="250" y2="390" stroke="#0f172a" stroke-width="3"/>

    <!-- Left Upper Door (Ice & Water Dispenser) -->
    <rect x="135" y="160" width="70" height="100" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <rect x="150" y="180" width="40" height="50" rx="4" fill="#020617"/>
    <line x1="170" y1="200" x2="170" y2="225" stroke="#38bdf8" stroke-width="2.5"/> <!-- Water Lever -->

    <!-- Right Upper Door: The Famous Mirrored InstaView Glass Panel -->
    <rect x="265" y="85" width="105" height="280" rx="8" fill="url(#instaViewGlass)" stroke="#facc15" stroke-width="2" filter="drop-shadow(0 0 8px rgba(250, 204, 21, 0.4))"/>
    <!-- Illuminated Shelves Inside InstaView Glass -->
    <line x1="275" y1="140" x2="360" y2="140" stroke="#fef08a" stroke-width="3"/>
    <line x1="275" y1="200" x2="360" y2="200" stroke="#fef08a" stroke-width="3"/>
    <line x1="275" y1="260" x2="360" y2="260" stroke="#fef08a" stroke-width="3"/>
    <line x1="275" y1="320" x2="360" y2="320" stroke="#fef08a" stroke-width="3"/>

    <!-- Lower Freezer Pull-Out Drawer Horizontal Seams -->
    <line x1="110" y1="395" x2="390" y2="395" stroke="#0f172a" stroke-width="3"/>
    <line x1="110" y1="485" x2="390" y2="485" stroke="#0f172a" stroke-width="3"/>

    <!-- Recessed Pocket Door Handles -->
    <rect x="140" y="385" width="80" height="6" rx="2" fill="#0f172a"/>
    <rect x="280" y="385" width="80" height="6" rx="2" fill="#0f172a"/>
    <rect x="210" y="475" width="80" height="6" rx="2" fill="#0f172a"/>
  </g>
</svg>