<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <filter id="cordZeroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#cordZeroShadow)">
    <!-- All-in-One Auto-Emptying Tower Station (Left Background) -->
    <rect x="120" y="110" width="110" height="490" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="175" cy="160" r="12" fill="#38bdf8"/>
    <rect x="135" y="200" width="80" height="380" rx="6" fill="#e2e8f0"/>

    <!-- CordZero Stick Vacuum (Docked Alongside) -->
    <!-- Handle & Kompressor Motor -->
    <rect x="250" y="120" width="60" height="75" rx="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <circle cx="280" cy="155" r="18" fill="#e11d48"/> <!-- Kompressor Lever -->

    <!-- Long Metallic Iron Gray Wand -->
    <rect x="272" y="195" width="16" height="350" rx="5" fill="#64748b" stroke="#475569" stroke-width="1.5"/>

    <!-- Power Drive Cleaner Head -->
    <rect x="235" y="545" width="90" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <ellipse cx="280" cy="580" rx="36" ry="12" fill="#e11d48"/>
  </g>
</svg>