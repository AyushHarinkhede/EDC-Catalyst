<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="tvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="oledGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="oledWallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="35%" stop-color="#312e81"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <g filter="url(#tvShadow)">
    <!-- Metallic Center Pedestal Stand -->
    <ellipse cx="325" cy="415" rx="140" ry="12" fill="#334155" opacity="0.4"/>
    <rect x="235" y="395" width="180" height="15" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 285,395 L 300,360 L 350,360 L 365,395 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1.2"/>

    <!-- Ultra-Thin OLED Panel Outer Bezel (Near Bezel-less) -->
    <rect x="50" y="50" width="550" height="320" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Self-Lighting OLED evo Display Window -->
    <rect x="54" y="54" width="542" height="308" rx="4" fill="url(#oledWallpaper)"/>
    
    <!-- Vibrant 4K HDR Cosmic Wave Graphics on Screen -->
    <path d="M 54,260 Q 200,120 340,240 T 596,160 L 596,362 L 54,362 Z" fill="#ec4899" opacity="0.6"/>
    <path d="M 54,300 Q 220,180 380,280 T 596,220 L 596,362 L 54,362 Z" fill="#38bdf8" opacity="0.65"/>
    <circle cx="480" cy="120" r="45" fill="#facc15" opacity="0.8" filter="blur(8px)"/>

    <!-- LG Logo (Bottom Center Bezel) -->
    <circle cx="325" cy="365" r="4" fill="#e11d48"/>
  </g>
</svg>