<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <filter id="cineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="silverCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <g filter="url(#cineShadow)">
    <!-- 360° Rotating Architectural Metal Handle / Stand (Tilted Down as Base) -->
    <rect x="130" y="140" width="240" height="240" rx="28" fill="none" stroke="#64748b" stroke-width="14"/>

    <!-- Minimalist Silver Cube Projector Body -->
    <rect x="160" y="110" width="180" height="180" rx="14" fill="url(#silverCube)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Front Optical Lens Window -->
    <circle cx="220" cy="180" r="38" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="220" cy="180" r="24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="220" cy="180" r="10" fill="#38bdf8" opacity="0.8"/>
    
    <!-- 4K Laser Projection Beam -->
    <polygon points="220,180 30,130 30,230" fill="#38bdf8" opacity="0.15"/>

    <!-- Top Power Button & Auto-Focus Sensor -->
    <circle cx="295" cy="145" r="5" fill="#334155"/>
    <circle cx="295" cy="165" r="3" fill="#ef4444"/>

    <!-- Metal Hinge Pivot Points on Sides -->
    <circle cx="155" cy="200" r="10" fill="#334155"/>
    <circle cx="345" cy="200" r="10" fill="#334155"/>
  </g>
</svg>