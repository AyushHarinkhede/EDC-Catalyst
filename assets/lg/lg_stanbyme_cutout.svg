<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="100%" height="100%">
  <defs>
    <filter id="stanbyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="beigeLifestyle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
  </defs>
  <g filter="url(#stanbyShadow)">
    <!-- Concealed 5-Wheel Rollable Disc Base -->
    <ellipse cx="225" cy="600" rx="90" ry="20" fill="url(#beigeLifestyle)" stroke="#d6d3d1" stroke-width="2"/>
    <ellipse cx="225" cy="597" rx="82" ry="16" fill="#fafaf9"/>

    <!-- Telescopic Height-Adjustable Stand Pole -->
    <rect x="218" y="240" width="14" height="355" rx="7" fill="url(#beigeLifestyle)" stroke="#d6d3d1" stroke-width="1.5"/>

    <!-- Rear Swivel/Tilt Articulated Arm Clamping to Screen -->
    <circle cx="225" cy="240" r="16" fill="#78716c"/>

    <!-- 27-Inch Matte Wireless Screen (Adjustable Orientation) -->
    <rect x="80" y="80" width="290" height="190" rx="14" fill="#1c1917" stroke="url(#beigeLifestyle)" stroke-width="6"/>
    
    <!-- Screen Display UI Window -->
    <rect x="86" y="86" width="278" height="178" rx="10" fill="#0c0a09"/>
    
    <!-- Modern Lifestyle Widget UI (Clock & Media Controls) -->
    <g fill="#fafaf9">
      <text x="110" y="125" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="300">10:42</text>
      <text x="110" y="145" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#a8a29e">SATURDAY, OCTOBER 24</text>
    </g>
    <!-- Music Player Card Widget on Screen -->
    <rect x="105" y="165" width="240" height="70" rx="10" fill="#292524" opacity="0.8"/>
    <circle cx="135" cy="200" r="18" fill="#e11d48"/>
    <rect x="165" y="190" width="80" height="8" rx="2" fill="#fafaf9"/>
    <rect x="165" y="205" width="50" height="6" rx="2" fill="#78716c"/>
  </g>
</svg>