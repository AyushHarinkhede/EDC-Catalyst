<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <filter id="microShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#microShadow)">
    <!-- Microwave Body -->
    <rect x="70" y="90" width="460" height="260" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>

    <!-- Seamless Smoked Glass Door (Left) -->
    <rect x="85" y="105" width="310" height="230" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="110" y="125" width="260" height="190" rx="4" fill="#0f172a"/>
    <circle cx="240" cy="220" r="55" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>

    <!-- Right Touch Control Panel & Digital Dial -->
    <rect x="410" y="105" width="105" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- LED Clock Display -->
    <rect x="420" y="120" width="85" height="40" rx="4" fill="#020617"/>
    <text x="462" y="146" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">12:00</text>
    
    <!-- Smart Inverter Touch Controls -->
    <circle cx="435" cy="185" r="6" fill="#334155"/>
    <circle cx="462" cy="185" r="6" fill="#334155"/>
    <circle cx="490" cy="185" r="6" fill="#334155"/>
    
    <!-- Start & Stop Touch Bars -->
    <rect x="422" y="270" width="80" height="24" rx="4" fill="#10b981"/>
    <text x="462" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">START</text>
    
    <!-- NeoChef Inscription -->
    <text x="462" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">NeoChef</text>
  </g>
</svg>