<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="100%">
  <defs>
    <filter id="acShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
    <linearGradient id="acWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <g filter="url(#acShadow)">
    <!-- Indoor Split AC Curved Chassis -->
    <rect x="60" y="80" width="530" height="150" rx="18" fill="url(#acWhite)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Bottom Airflow Louver Blade -->
    <rect x="75" y="195" width="500" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Dual Vane Airflow Dispersion Slots -->
    <line x1="85" y1="206" x2="565" y2="206" stroke="#0284c7" stroke-width="2.5" opacity="0.6"/>

    <!-- Hidden Magic Display (Shows 18°C in Ice Blue) -->
    <text x="490" y="145" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#0284c7">18°</text>
    
    <!-- LG DUAL Inverter Logo & Thinq Icon -->
    <circle cx="100" cy="115" r="7" fill="#e11d48"/>
    <text x="115" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#334155">LG DUALCOOL</text>
    <text x="115" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">AI Inverter · ThinQ</text>
  </g>
</svg>