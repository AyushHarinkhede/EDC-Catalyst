<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="100%" height="100%">
  <defs>
    <filter id="stylerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="stylerMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <g filter="url(#stylerShadow)">
    <!-- Tall Elegant Styler Cabinet -->
    <rect x="110" y="40" width="180" height="600" rx="18" fill="url(#stylerMirror)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Full Length Tinted Glass Mirror Front -->
    <rect x="116" y="46" width="168" height="588" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5"/>

    <!-- Touch Display Hidden Behind Mirror (Center Door) -->
    <text x="200" y="270" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">REFRESH</text>
    <text x="200" y="295" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">39 MIN</text>

    <!-- Side Door Handle -->
    <rect x="112" y="250" width="5" height="70" rx="2" fill="#cbd5e1"/>

    <!-- TrueSteam Logo -->
    <text x="200" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="2" text-anchor="middle">LG Styler · TrueSteam</text>
  </g>
</svg>