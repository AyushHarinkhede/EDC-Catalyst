<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <filter id="alphaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="bodyMagnesium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e37"/>
      <stop offset="40%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="lensRingGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#090d16"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sonyCopperMount" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#alphaShadow)">
    <!-- Main Camera Chassis -->
    <!-- Right Textured Handgrip Profile -->
    <path d="M 380,130 C 440,130 460,160 455,220 C 450,290 465,370 420,380 L 160,380 C 130,380 130,220 135,160 C 140,140 160,130 200,130 Z" fill="url(#bodyMagnesium)" stroke="#334155" stroke-width="2"/>

    <!-- Grip Leatherette Texture (Dotted Matrix) -->
    <rect x="375" y="150" width="75" height="215" rx="16" fill="#181a1f" stroke="#262a33" stroke-width="1.5"/>
    <g fill="#0b0d10" opacity="0.65">
      <circle cx="390" cy="170" r="1.5"/><circle cx="400" cy="170" r="1.5"/><circle cx="410" cy="170" r="1.5"/><circle cx="420" cy="170" r="1.5"/><circle cx="430" cy="170" r="1.5"/>
      <circle cx="390" cy="190" r="1.5"/><circle cx="400" cy="190" r="1.5"/><circle cx="410" cy="190" r="1.5"/><circle cx="420" cy="190" r="1.5"/><circle cx="430" cy="190" r="1.5"/>
      <circle cx="390" cy="210" r="1.5"/><circle cx="400" cy="210" r="1.5"/><circle cx="410" cy="210" r="1.5"/><circle cx="420" cy="210" r="1.5"/><circle cx="430" cy="210" r="1.5"/>
      <circle cx="390" cy="230" r="1.5"/><circle cx="400" cy="230" r="1.5"/><circle cx="410" cy="230" r="1.5"/><circle cx="420" cy="230" r="1.5"/><circle cx="430" cy="230" r="1.5"/>
      <circle cx="390" cy="250" r="1.5"/><circle cx="400" cy="250" r="1.5"/><circle cx="410" cy="250" r="1.5"/><circle cx="420" cy="250" r="1.5"/><circle cx="430" cy="250" r="1.5"/>
      <circle cx="390" cy="270" r="1.5"/><circle cx="400" cy="270" r="1.5"/><circle cx="410" cy="270" r="1.5"/><circle cx="420" cy="270" r="1.5"/><circle cx="430" cy="270" r="1.5"/>
    </g>

    <!-- Top Viewfinder Prism & Hot Shoe Hump -->
    <path d="M 230,130 L 250,85 L 310,85 L 330,130 Z" fill="#1f232b" stroke="#334155" stroke-width="1.8"/>
    <!-- Top Multi-Interface Hot Shoe -->
    <rect x="260" y="80" width="40" height="8" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>

    <!-- Left Mode Dial (Drive mode / AF dial for flagship A1) -->
    <rect x="155" y="115" width="45" height="18" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="160" y="110" width="35" height="6" rx="2" fill="#475569"/>

    <!-- Right Mode & Exposure Compensation Dials -->
    <rect x="340" y="115" width="40" height="18" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="390" y="118" width="35" height="15" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Shutter Button & Power Switch on Top of Grip -->
    <ellipse cx="425" cy="136" rx="12" ry="7" fill="#64748b"/>
    <circle cx="425" cy="135" r="7" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

    <!-- SONY Wordmark on Prism (Clean White Technical Sans) -->
    <text x="280" y="116" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">SONY</text>

    <!-- Iconic Orange/Copper Full-Frame E-Mount Flange Ring -->
    <circle cx="280" cy="255" r="114" fill="none" stroke="url(#sonyCopperMount)" stroke-width="4.5"/>
    <circle cx="280" cy="255" r="109" fill="#0f172a" stroke="#475569" stroke-width="3"/>

    <!-- Deep Camera Lens / Sensor Aperture Glass -->
    <circle cx="280" cy="255" r="95" fill="url(#lensRingGlass)"/>
    <!-- Lens Elements & Aperture Blades -->
    <circle cx="280" cy="255" r="75" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <circle cx="280" cy="255" r="50" fill="#020617"/>
    <!-- Green/Magenta Anti-Reflective Optical Coating Reflections -->
    <ellipse cx="265" cy="235" rx="38" ry="24" fill="#10b981" opacity="0.25"/>
    <ellipse cx="295" cy="275" rx="42" ry="26" fill="#ec4899" opacity="0.22"/>

    <!-- Alpha Greek Letter Symbol 'α' (Official Sony Orange) -->
    <g transform="translate(195, 165)">
      <text x="0" y="24" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#ea580c">α</text>
    </g>

    <!-- Flagship Gold '1' Emblem (Specific to Sony Alpha 1) -->
    <g transform="translate(345, 175)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="11" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">1</text>
    </g>

    <!-- 8K / SteadyShot INSIDE Badges -->
    <rect x="155" y="340" width="48" height="16" rx="3" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="179" y="352" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#f59e0b" text-anchor="middle">8K HDR</text>
  </g>
</svg>