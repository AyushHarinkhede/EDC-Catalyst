<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <filter id="ps5Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="ps5PlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ps5CoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ps5LedBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="controllerGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <g filter="url(#ps5Shadow)">
    <!-- PS5 Console Stand -->
    <ellipse cx="230" cy="460" rx="90" ry="18" fill="#1e293b" opacity="0.85"/>
    <ellipse cx="230" cy="458" rx="84" ry="14" fill="#0f172a"/>

    <!-- PS5 CONSOLE TOWER -->
    <!-- Center Glossy Black Core -->
    <path d="M 195,110 C 190,200 185,340 182,450 L 278,450 C 275,340 270,200 265,110 Z" fill="url(#ps5CoreGrad)"/>
    
    <!-- LED Light Strips along Inner Edge of Plates -->
    <path d="M 192,108 C 187,200 183,340 180,448" fill="none" stroke="url(#ps5LedBlue)" stroke-width="3.5" filter="drop-shadow(0 0 6px #3b82f6)"/>
    <path d="M 268,108 C 273,200 277,340 280,448" fill="none" stroke="url(#ps5LedBlue)" stroke-width="3.5" filter="drop-shadow(0 0 6px #3b82f6)"/>

    <!-- Left Outer White Collar Plate -->
    <path d="M 170,70 C 185,60 215,90 205,140 C 195,200 182,320 170,450 C 165,455 178,458 190,454 C 198,340 204,210 215,130 C 220,90 195,65 170,70 Z" fill="url(#ps5PlateGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Right Outer White Collar Plate -->
    <path d="M 290,70 C 275,60 245,90 255,140 C 265,200 278,320 290,450 C 295,455 282,458 270,454 C 262,340 256,210 245,130 C 240,90 265,65 290,70 Z" fill="url(#ps5PlateGrad)" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Disc Slot (Subtle side profile) -->
    <rect x="256" y="320" width="4" height="95" rx="2" fill="#020617"/>

    <!-- Front USB Ports & Power Button -->
    <rect x="228" y="270" width="4" height="12" rx="1.5" fill="#38bdf8"/>
    <rect x="228" y="290" width="4" height="10" rx="1" fill="#64748b"/>
    <rect x="229" y="315" width="2" height="8" rx="0.5" fill="#475569"/>

    <!-- Official PlayStation Logo Cutout on Top Left Wing -->
    <g transform="translate(178, 86) scale(0.38)">
      <path d="M10,2 L6,14 L12,13 L12,6 L16,7 L16,12 L22,10 L22,2 Z" fill="#94a3b8"/>
    </g>

    <!-- DUALSENSE WIRELESS CONTROLLER (Foreground Angled) -->
    <g transform="translate(300, 260)">
      <!-- Controller Outer Body -->
      <path d="M 50,60 C 30,80 15,130 25,180 C 32,205 55,200 70,175 C 80,160 90,130 110,130 C 130,130 140,160 150,175 C 165,200 188,205 195,180 C 205,130 190,80 170,60 C 150,45 130,48 110,50 C 90,48 70,45 50,60 Z" fill="url(#controllerGrip)" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Black Center Ergonomic Accent -->
      <path d="M 65,115 C 60,140 70,175 80,175 C 90,175 95,145 110,145 C 125,145 130,175 140,175 C 150,175 160,140 155,115 C 145,100 130,95 110,95 C 90,95 75,100 65,115 Z" fill="#0f172a"/>

      <!-- Center Touchpad -->
      <rect x="85" y="55" width="50" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Touchpad Blue Glowing Border -->
      <path d="M 83,55 L 83,91 L 137,91 L 137,55" fill="none" stroke="#3b82f6" stroke-width="1.8" filter="drop-shadow(0 0 3px #60a5fa)"/>

      <!-- Left Thumbstick & Right Thumbstick -->
      <circle cx="88" cy="135" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
      <circle cx="88" cy="135" r="11" fill="#1e293b"/>
      <circle cx="88" cy="135" r="5" fill="#475569"/>

      <circle cx="132" cy="135" r="16" fill="#334155" stroke="#1e293b" stroke-width="2"/>
      <circle cx="132" cy="135" r="11" fill="#1e293b"/>
      <circle cx="132" cy="135" r="5" fill="#475569"/>

      <!-- Directional D-Pad (Left) -->
      <g transform="translate(56, 75)">
        <path d="M 6,0 L 10,0 L 10,6 L 16,6 L 16,10 L 10,10 L 10,16 L 6,16 L 6,10 L 0,10 L 0,6 L 6,6 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      </g>

      <!-- Action Buttons: Triangle, Circle, Cross, Square (Right) -->
      <g transform="translate(148, 72)">
        <circle cx="16" cy="6" r="3.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/> <!-- Triangle -->
        <circle cx="24" cy="14" r="3.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/> <!-- Circle -->
        <circle cx="16" cy="22" r="3.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/> <!-- Cross -->
        <circle cx="8" cy="14" r="3.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/> <!-- Square -->
      </g>

      <!-- Center PS Home Button & Mute Mic -->
      <path d="M 106,120 L 114,120 L 110,113 Z" fill="#94a3b8"/>
      <rect x="108" y="100" width="4" height="2" rx="1" fill="#ff7a00"/>
    </g>
  </g>
</svg>