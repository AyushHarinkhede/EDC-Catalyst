<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <filter id="a9Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="a9Magnesium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d313b"/>
      <stop offset="50%" stop-color="#1f232a"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="a9CopperMount" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <g filter="url(#a9Shadow)">
    <!-- Main Camera Chassis -->
    <path d="M 380,130 C 440,130 460,160 455,220 C 450,290 465,370 420,380 L 160,380 C 130,380 130,220 135,160 C 140,140 160,130 200,130 Z" fill="url(#a9Magnesium)" stroke="#334155" stroke-width="2"/>

    <!-- Grip Leatherette Texture -->
    <rect x="375" y="150" width="75" height="215" rx="16" fill="#181a1f" stroke="#262a33" stroke-width="1.5"/>
    <g fill="#0a0c0e" opacity="0.6">
      <circle cx="390" cy="170" r="1.5"/><circle cx="405" cy="170" r="1.5"/><circle cx="420" cy="170" r="1.5"/>
      <circle cx="390" cy="200" r="1.5"/><circle cx="405" cy="200" r="1.5"/><circle cx="420" cy="200" r="1.5"/>
      <circle cx="390" cy="230" r="1.5"/><circle cx="405" cy="230" r="1.5"/><circle cx="420" cy="230" r="1.5"/>
      <circle cx="390" cy="260" r="1.5"/><circle cx="405" cy="260" r="1.5"/><circle cx="420" cy="260" r="1.5"/>
    </g>

    <!-- Top Viewfinder Prism & Hot Shoe -->
    <path d="M 230,130 L 250,85 L 310,85 L 330,130 Z" fill="#1f232b" stroke="#334155" stroke-width="1.8"/>
    <rect x="260" y="80" width="40" height="8" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"/>

    <!-- Stacked Dual Dials on Left (Drive Mode + Focus Mode specific to A9) -->
    <rect x="155" y="112" width="45" height="12" rx="2" fill="#334155" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="160" y="124" width="45" height="10" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>

    <!-- Right Dials & Shutter -->
    <rect x="340" y="115" width="40" height="18" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="425" cy="135" r="7" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

    <!-- SONY Wordmark -->
    <text x="280" y="116" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">SONY</text>

    <!-- Iconic Orange E-Mount Flange Ring -->
    <circle cx="280" cy="255" r="114" fill="none" stroke="url(#a9CopperMount)" stroke-width="4.5"/>
    <circle cx="280" cy="255" r="109" fill="#0f172a" stroke="#475569" stroke-width="3"/>

    <!-- Lens Optical Aperture Glass -->
    <circle cx="280" cy="255" r="95" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <circle cx="280" cy="255" r="65" fill="#020617"/>
    <ellipse cx="265" cy="235" rx="35" ry="20" fill="#3b82f6" opacity="0.3"/>
    <ellipse cx="295" cy="275" rx="40" ry="24" fill="#10b981" opacity="0.25"/>

    <!-- Alpha Greek Letter 'α' -->
    <g transform="translate(195, 165)">
      <text x="0" y="24" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#ea580c">α</text>
    </g>

    <!-- Silver '9' Badge (Specific to Sony Alpha 9) -->
    <g transform="translate(345, 175)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="11" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
    </g>

    <!-- 4K / 20 FPS Continuous Badge -->
    <rect x="155" y="340" width="56" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="183" y="352" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle">20 FPS AF</text>
  </g>
</svg>