<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="rdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="hardmetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="diastarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <g filter="url(#rdShadow)">
    <!-- Solid Steel Bracelet -->
    <path d="M190,40 L310,40 L300,120 L200,120 Z" fill="url(#hardmetal)" stroke="#334155" stroke-width="1.5"/>
    <line x1="193" y1="80" x2="307" y2="80" stroke="#64748b" stroke-width="2"/>
    <path d="M200,380 L300,380 L310,460 L190,460 Z" fill="url(#hardmetal)" stroke="#334155" stroke-width="1.5"/>
    <line x1="193" y1="420" x2="307" y2="420" stroke="#64748b" stroke-width="2"/>

    <!-- Iconic Oval Shield-Shaped Hardmetal Tungsten-Carbide Bezel -->
    <ellipse cx="250" cy="250" rx="120" ry="142" fill="url(#hardmetal)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="250" cy="250" rx="108" ry="130" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>

    <!-- Round Crystal & Dial -->
    <circle cx="250" cy="250" r="88" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Vertical Brushed Dial -->
    <circle cx="250" cy="250" r="86" fill="url(#diastarGold)"/>
    <line x1="200" y1="165" x2="200" y2="335" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <line x1="225" y1="165" x2="225" y2="335" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <line x1="250" y1="165" x2="250" y2="335" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <line x1="275" y1="165" x2="275" y2="335" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <line x1="300" y1="165" x2="300" y2="335" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

    <!-- Red Anchor Logo at 12 o'clock -->
    <circle cx="250" cy="192" r="8" fill="#dc2626"/>
    <!-- Silver Anchor -->
    <path d="M248,188 L252,188 M250,188 L250,196 M247,194 Q250,197 253,194" stroke="#ffffff" stroke-width="1.5" fill="none"/>

    <text x="250" y="210" font-family="'Helvetica Neue', sans-serif" font-size="8.5" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="1">RADO</text>
    <text x="250" y="218" font-family="'Helvetica Neue', sans-serif" font-size="6" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="0.5">DiaStar</text>

    <!-- Jewel Stud Hour Markers -->
    <circle cx="250" cy="172" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="288" cy="182" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="316" cy="212" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="328" cy="250" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="316" cy="288" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="288" cy="318" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="212" cy="318" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="184" cy="288" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="172" cy="250" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="184" cy="212" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <circle cx="212" cy="182" r="3" fill="#ffffff" stroke="#78350f" stroke-width="1"/>

    <!-- Vertical Day-Date Aperture at 6 o'clock -->
    <rect x="242" y="295" width="16" height="24" rx="1.5" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <text x="250" y="306" font-family="'Helvetica Neue', sans-serif" font-size="7" font-weight="bold" fill="#dc2626" text-anchor="middle">SUN</text>
    <text x="250" y="316" font-family="'Helvetica Neue', sans-serif" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">12</text>

    <!-- Gold Baton Hands -->
    <g transform="rotate(-60 250 250)">
      <rect x="247" y="200" width="6" height="52" rx="1" fill="#78350f"/>
      <rect x="248" y="205" width="4" height="20" fill="#ffffff"/>
    </g>
    <g transform="rotate(55 250 250)">
      <rect x="247.5" y="175" width="5" height="77" rx="1" fill="#78350f"/>
      <rect x="248.5" y="180" width="3" height="30" fill="#ffffff"/>
    </g>
    <circle cx="250" cy="250" r="4" fill="#78350f"/>
  </g>
</svg>