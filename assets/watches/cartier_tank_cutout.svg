<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="ctShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="tankSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="40%" stop-color="#292524"/>
      <stop offset="80%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <g filter="url(#ctShadow)">
    <!-- Black Grained Leather Strap -->
    <!-- Top Strap -->
    <rect x="180" y="40" width="140" height="120" rx="4" fill="url(#leatherStrap)" stroke="#1c1917" stroke-width="1"/>
    <line x1="186" y1="40" x2="186" y2="155" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3, 3"/>
    <line x1="314" y1="40" x2="314" y2="155" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3, 3"/>

    <!-- Bottom Strap -->
    <rect x="180" y="340" width="140" height="120" rx="4" fill="url(#leatherStrap)" stroke="#1c1917" stroke-width="1"/>
    <line x1="186" y1="345" x2="186" y2="460" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3, 3"/>
    <line x1="314" y1="345" x2="314" y2="460" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3, 3"/>

    <!-- Cartier Tank Rectangular Case with Parallel Brancards -->
    <!-- Left Brancard Lug -->
    <rect x="160" y="130" width="26" height="240" rx="10" fill="url(#tankSteel)" stroke="#475569" stroke-width="1.5"/>
    <!-- Right Brancard Lug -->
    <rect x="314" y="130" width="26" height="240" rx="10" fill="url(#tankSteel)" stroke="#475569" stroke-width="1.5"/>

    <!-- Main Case Body -->
    <rect x="178" y="150" width="144" height="200" fill="url(#tankSteel)" stroke="#64748b" stroke-width="1"/>

    <!-- Beaded Crown with Blue Synthetic Spinel Cabochon -->
    <path d="M340,240 L354,244 L354,256 L340,260 Z" fill="url(#tankSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="356" cy="250" r="5" fill="#1d4ed8" stroke="#1e40af" stroke-width="1"/>

    <!-- Silvered Opaline Dial -->
    <rect x="186" y="160" width="128" height="180" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Railroad Minute Track (Chemin de fer) -->
    <rect x="204" y="180" width="92" height="140" fill="none" stroke="#1e293b" stroke-width="1"/>
    <rect x="210" y="186" width="80" height="128" fill="none" stroke="#1e293b" stroke-width="1"/>

    <!-- Cartier Wordmark -->
    <text x="250" y="218" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle" letter-spacing="1.5">Cartier</text>
    <text x="250" y="306" font-family="'Times New Roman', serif" font-size="5" fill="#64748b" text-anchor="middle" letter-spacing="1">SWISS MADE</text>

    <!-- Bold Roman Numerals -->
    <!-- Top & Bottom -->
    <text x="250" y="177" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">XII</text>
    <text x="250" y="333" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">VI</text>
    <!-- Right -->
    <text x="282" y="196" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
    <text x="298" y="222" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
    <text x="303" y="255" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">III</text>
    <text x="298" y="286" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">IIII</text>
    <text x="282" y="316" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">V</text>
    <!-- Left -->
    <text x="218" y="316" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">VII</text>
    <text x="202" y="286" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">VIII</text>
    <text x="197" y="255" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">IX</text>
    <text x="202" y="222" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">X</text>
    <text x="218" y="196" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">XI</text>

    <!-- Secret signature in VII -->
    <text x="214" y="322" font-family="sans-serif" font-size="2" fill="#1e293b" transform="rotate(-45 214 322)">CARTIER</text>

    <!-- Blued-Steel Sword Hands (Aiguilles glaive) -->
    <!-- Hour Hand -->
    <g transform="rotate(-65 250 250)">
      <polygon points="248,250 248,212 250,205 252,212 252,250" fill="#1e3a8a"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(40 250 250)">
      <polygon points="248.5,250 248.5,195 250,188 251.5,195 251.5,250" fill="#1e3a8a"/>
    </g>
    <circle cx="250" cy="250" r="3" fill="#1e3a8a"/>
  </g>
</svg>