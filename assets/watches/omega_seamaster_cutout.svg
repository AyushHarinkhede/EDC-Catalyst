<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="omShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="omSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="omBlueCeramic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>

  <g filter="url(#omShadow)">
    <!-- 5-Link Seamaster Bracelet -->
    <path d="M192,40 L308,40 L300,140 L200,140 Z" fill="url(#omSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="215" y1="40" x2="220" y2="140" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="285" y1="40" x2="280" y2="140" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="195" y1="80" x2="305" y2="80" stroke="#475569" stroke-width="2"/>
    <line x1="198" y1="115" x2="302" y2="115" stroke="#475569" stroke-width="2"/>

    <path d="M200,360 L300,360 L308,460 L192,460 Z" fill="url(#omSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="220" y1="360" x2="215" y2="460" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="280" y1="360" x2="285" y2="460" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="198" y1="385" x2="302" y2="385" stroke="#475569" stroke-width="2"/>
    <line x1="195" y1="420" x2="305" y2="420" stroke="#475569" stroke-width="2"/>

    <!-- Twisted Lyre Lugs Case -->
    <path d="M165,140 C165,105 200,95 250,95 C300,95 335,105 335,140 L335,360 C335,395 300,405 250,405 C200,405 165,395 165,360 Z" fill="url(#omSteel)" stroke="#475569" stroke-width="2"/>

    <!-- Conical Helium Escape Valve at 10 o'clock -->
    <path d="M175,175 L160,165 L165,155 L180,165 Z" fill="url(#omSteel)" stroke="#334155" stroke-width="1"/>
    <text x="167" y="166" font-family="sans-serif" font-size="4" font-weight="bold" fill="#0284c7" transform="rotate(-40 167 166)">He</text>

    <!-- Screw-Down Crown at 3 o'clock -->
    <rect x="355" y="238" width="16" height="24" rx="3" fill="url(#omSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="363" cy="250" r="3" fill="none" stroke="#0284c7" stroke-width="1"/>

    <!-- Scalloped Dive Bezel (Iconic 12-sided scallop grip) -->
    <circle cx="250" cy="250" r="126" fill="url(#omSteel)" stroke="#334155" stroke-width="2"/>
    <!-- Blue Ceramic Bezel Insert with Grand Feu White Enamel Scale -->
    <circle cx="250" cy="250" r="120" fill="url(#omBlueCeramic)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="92" fill="#0369a1" stroke="#ffffff" stroke-width="1"/>

    <!-- Bezel Markings -->
    <polygon points="250,133 243,143 257,143" fill="#ffffff"/>
    <circle cx="250" cy="140" r="3" fill="#e0f2fe"/>
    <text x="312" y="165" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="350" y="235" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>
    <text x="335" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">30</text>
    <text x="250" y="360" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">40</text>
    <text x="165" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">50</text>

    <!-- Dial (Polished Blue Ceramic with Laser Waves) -->
    <circle cx="250" cy="250" r="90" fill="url(#omBlueCeramic)"/>

    <!-- Laser-Engraved Wave Pattern -->
    <path d="M175,200 Q200,195 225,200 T275,200 T325,200" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M170,215 Q200,210 230,215 T290,215 T330,215" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M165,230 Q200,225 235,230 T305,230 T335,230" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M165,260 Q200,255 235,260 T305,260 T335,260" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M170,275 Q200,270 230,275 T290,275 T330,275" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <path d="M175,290 Q200,285 225,290 T275,290 T325,290" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

    <!-- Date at 6 o'clock -->
    <rect x="241" y="310" width="18" height="15" rx="1" fill="#ffffff"/>
    <text x="250" y="322" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">18</text>

    <!-- Super-LumiNova Indices -->
    <rect x="243" y="165" width="5" height="16" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="252" y="165" width="5" height="16" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="166" y="246" width="16" height="8" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="318" y="246" width="16" height="8" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="295" cy="176" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="324" cy="205" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="324" cy="295" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="295" cy="324" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="205" cy="324" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="176" cy="295" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="176" cy="205" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="205" cy="176" r="6.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Dial Text -->
    <!-- Omega Logo & Wordmark -->
    <path d="M246,195 A4,4 0 1,1 254,195 L256,196 L253,196 A3,3 0 1,0 247,196 L244,196 Z" fill="#ffffff"/>
    <text x="250" y="206" font-family="'Helvetica Neue', sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">OMEGA</text>
    <text x="250" y="213" font-family="'Brush Script MT', cursive, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">Seamaster</text>
    <text x="250" y="220" font-family="'Helvetica Neue', sans-serif" font-size="4" fill="#ffffff" text-anchor="middle">PROFESSIONAL CO-AXIAL</text>
    <text x="250" y="225" font-family="'Helvetica Neue', sans-serif" font-size="4" fill="#ffffff" text-anchor="middle">MASTER CHRONOMETER</text>
    <text x="250" y="230" font-family="'Helvetica Neue', sans-serif" font-size="3.5" fill="#94a3b8" text-anchor="middle">300m / 1000ft</text>

    <!-- Skeletonized Sword Hands (Iconic Seamaster Hands) -->
    <!-- Hour Hand -->
    <g transform="rotate(-60 250 250)">
      <polygon points="247,250 246,195 250,185 254,195 253,250" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
      <polygon points="248,194 250,188 252,194" fill="#f0f9ff"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(65 250 250)">
      <polygon points="247,250 246,168 250,158 254,168 253,250" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
      <polygon points="248,167 250,161 252,167" fill="#f0f9ff"/>
    </g>
    <!-- Red Tip Seconds Hand -->
    <g transform="rotate(140 250 250)">
      <line x1="250" y1="270" x2="250" y2="160" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="250" cy="175" r="3" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
      <polygon points="249,165 250,158 251,165" fill="#ef4444"/>
    </g>
    <circle cx="250" cy="250" r="4.5" fill="#cbd5e1" stroke="#0284c7" stroke-width="1"/>
  </g>
</svg>