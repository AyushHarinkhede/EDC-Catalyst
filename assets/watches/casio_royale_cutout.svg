<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="crShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="casioSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="lcdLuster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6c99c"/>
      <stop offset="100%" stop-color="#9eb682"/>
    </linearGradient>
  </defs>

  <g filter="url(#crShadow)">
    <!-- Folded Stainless Steel Bracelet -->
    <path d="M185,35 L315,35 L300,120 L200,120 Z" fill="url(#casioSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="188" y1="65" x2="312" y2="65" stroke="#475569" stroke-width="2"/>
    <line x1="192" y1="95" x2="308" y2="95" stroke="#475569" stroke-width="2"/>

    <path d="M200,380 L300,380 L315,465 L185,465 Z" fill="url(#casioSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="192" y1="405" x2="308" y2="405" stroke="#475569" stroke-width="2"/>
    <line x1="188" y1="435" x2="312" y2="435" stroke="#475569" stroke-width="2"/>

    <!-- Square Angular Case with Bevelled Corners -->
    <polygon points="175,115 325,115 355,145 355,355 325,385 175,385 145,355 145,145" fill="url(#casioSteel)" stroke="#334155" stroke-width="2"/>

    <!-- 4 Classic Square Pushers (LIGHT, MODE, SEARCH, ADJUST) -->
    <rect x="138" y="160" width="8" height="22" rx="2" fill="#1e293b"/>
    <rect x="138" y="318" width="8" height="22" rx="2" fill="#1e293b"/>
    <rect x="354" y="160" width="8" height="22" rx="2" fill="#1e293b"/>
    <rect x="354" y="318" width="8" height="22" rx="2" fill="#1e293b"/>

    <!-- Screen Bezel Surround Inscription -->
    <rect x="160" y="130" width="180" height="240" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Top & Bottom Badging -->
    <text x="250" y="146" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CASIO</text>
    <text x="250" y="157" font-family="'Helvetica Neue', sans-serif" font-size="6" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">WORLD TIME</text>
    <text x="250" y="360" font-family="'Helvetica Neue', sans-serif" font-size="5.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ILLUMINATOR</text>

    <!-- Main Greenish-Olive High-Contrast LCD Screen Display Area -->
    <!-- TOP LEFT: Analog Radar Clock -->
    <circle cx="205" cy="205" r="32" fill="url(#lcdLuster)" stroke="#111" stroke-width="1.5"/>
    <circle cx="205" cy="205" r="28" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="2, 2"/>
    <!-- Digital Hands on Radar Dial -->
    <line x1="205" y1="205" x2="205" y2="185" stroke="#111" stroke-width="2.5"/>
    <line x1="205" y1="205" x2="222" y2="212" stroke="#111" stroke-width="2"/>
    <circle cx="205" cy="205" r="2" fill="#111"/>

    <!-- TOP RIGHT: Digital LCD World Map -->
    <rect x="245" y="173" width="82" height="42" rx="3" fill="url(#lcdLuster)" stroke="#111" stroke-width="1.5"/>
    <!-- World Continents Pixel Grid Silhouette -->
    <!-- Americas -->
    <path d="M250,182 Q254,180 256,186 Q254,195 258,206" fill="none" stroke="#15803d" stroke-width="2.5"/>
    <!-- Eurasia / Africa -->
    <path d="M268,182 Q285,180 295,185 Q290,195 285,204" fill="none" stroke="#15803d" stroke-width="3"/>
    <!-- Active Time Zone Highlight (Flashing segment) -->
    <rect x="282" y="184" width="8" height="8" fill="#ef4444" opacity="0.8"/>

    <!-- Indicators Bar (MUTE / ALM / SIG) -->
    <rect x="245" y="220" width="82" height="15" fill="url(#lcdLuster)" stroke="#111" stroke-width="1"/>
    <text x="255" y="231" font-family="'Courier New', monospace" font-size="7" font-weight="bold" fill="#111">MUTE</text>
    <text x="280" y="231" font-family="'Courier New', monospace" font-size="7" font-weight="bold" fill="#111">ALM</text>
    <text x="305" y="231" font-family="'Courier New', monospace" font-size="7" font-weight="bold" fill="#111">SIG</text>

    <!-- BOTTOM MAIN LCD: Big Digital Time Display -->
    <rect x="170" y="244" width="160" height="98" rx="4" fill="url(#lcdLuster)" stroke="#111" stroke-width="1.5"/>

    <!-- Day and Date Header -->
    <text x="180" y="264" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#111">SEC</text>
    <text x="225" y="264" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#111">DELHI</text>
    <text x="295" y="264" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#111">6-30</text>

    <!-- Massive 7-Segment Digital Clock "10:58 45" -->
    <text x="180" y="325" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#09090b" letter-spacing="-1">10:58</text>
    <text x="296" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#09090b">45</text>
    <text x="300" y="325" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#111">PM</text>

    <!-- Corner Decorative Screws -->
    <circle cx="158" cy="128" r="3" fill="#94a3b8" stroke="#334155" stroke-width="0.8"/>
    <circle cx="342" cy="128" r="3" fill="#94a3b8" stroke="#334155" stroke-width="0.8"/>
    <circle cx="158" cy="372" r="3" fill="#94a3b8" stroke="#334155" stroke-width="0.8"/>
    <circle cx="342" cy="372" r="3" fill="#94a3b8" stroke="#334155" stroke-width="0.8"/>
  </g>
</svg>