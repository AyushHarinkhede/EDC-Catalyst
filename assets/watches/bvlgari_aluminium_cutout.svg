<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="bvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="bvAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bvRubber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <g filter="url(#bvShadow)">
    <!-- Articulated Black Rubber & Aluminum Strap -->
    <!-- Top Strap -->
    <path d="M190,40 L310,40 L300,130 L200,130 Z" fill="url(#bvRubber)" stroke="#09090b" stroke-width="1.5"/>
    <!-- Aluminum Joint Link -->
    <rect x="194" y="80" width="112" height="12" rx="4" fill="url(#bvAlum)" stroke="#64748b" stroke-width="1"/>

    <!-- Bottom Strap -->
    <path d="M200,370 L300,370 L310,460 L190,460 Z" fill="url(#bvRubber)" stroke="#09090b" stroke-width="1.5"/>
    <rect x="194" y="410" width="112" height="12" rx="4" fill="url(#bvAlum)" stroke="#64748b" stroke-width="1"/>

    <!-- Aerospace Aluminum Case -->
    <circle cx="250" cy="250" r="126" fill="url(#bvAlum)" stroke="#475569" stroke-width="2"/>

    <!-- Black PVD Titanium Chrono Pushers & Crown -->
    <rect x="365" y="195" width="12" height="16" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <rect x="372" y="240" width="14" height="20" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <rect x="365" y="289" width="12" height="16" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>

    <!-- Matte Black Rubber Bezel with Embossed "BVLGARI BVLGARI" -->
    <circle cx="250" cy="250" r="120" fill="url(#bvRubber)" stroke="#09090b" stroke-width="2"/>
    <circle cx="250" cy="250" r="92" fill="#09090b"/>

    <!-- Dual BVLGARI Embossed Wordmarks on Bezel -->
    <!-- Top Arc -->
    <text font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="900" fill="#a1a1aa" letter-spacing="4">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">BVLGARI</textPath>
    </text>
    <!-- Bottom Arc -->
    <text font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="900" fill="#a1a1aa" letter-spacing="4">
      <textPath href="#botArc" startOffset="50%" text-anchor="middle">BVLGARI</textPath>
    </text>
    <path id="topArc" d="M 160,250 A 90,90 0 0,1 340,250" fill="none"/>
    <path id="botArc" d="M 340,250 A 90,90 0 0,1 160,250" fill="none"/>

    <!-- Warm Panda Silver Dial -->
    <circle cx="250" cy="250" r="90" fill="#f4f4f5"/>

    <!-- 3 Black Chronograph Sub-Dials (Panda Layout) -->
    <!-- 3 o'clock (Running Seconds) -->
    <circle cx="295" cy="250" r="18" fill="#18181b" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="295" y1="250" x2="295" y2="238" stroke="#ffffff" stroke-width="1"/>
    <!-- 6 o'clock (12-Hour Counter) -->
    <circle cx="250" cy="295" r="18" fill="#18181b" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="250" y1="295" x2="258" y2="295" stroke="#ffffff" stroke-width="1"/>
    <!-- 9 o'clock (30-Minute Counter) -->
    <circle cx="205" cy="250" r="18" fill="#18181b" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="205" y1="250" x2="200" y2="242" stroke="#ffffff" stroke-width="1"/>

    <!-- Bold 12 Numeral & Baton Markers -->
    <text x="250" y="185" font-family="'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#18181b" text-anchor="middle">12</text>
    <rect x="248" y="190" width="4" height="8" fill="#18181b"/>

    <!-- Date Aperture at 4:30 -->
    <rect x="285" y="278" width="14" height="12" rx="1.5" fill="#18181b"/>
    <text x="292" y="287" font-family="'Helvetica Neue', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">24</text>

    <!-- Dial Logo -->
    <text x="250" y="206" font-family="'Helvetica Neue', sans-serif" font-size="7.5" font-weight="900" fill="#18181b" text-anchor="middle" letter-spacing="1">BVLGARI</text>
    <text x="250" y="214" font-family="'Helvetica Neue', sans-serif" font-size="5" fill="#71717a" text-anchor="middle" letter-spacing="0.5">ALUMINIUM</text>

    <!-- Hands: Black Baton with Lume + Red-Tipped Chrono Seconds Hand -->
    <g transform="rotate(-55 250 250)">
      <rect x="247" y="195" width="6" height="55" rx="1.5" fill="#18181b"/>
      <rect x="248" y="200" width="4" height="25" fill="#ffffff"/>
    </g>
    <g transform="rotate(50 250 250)">
      <rect x="247.5" y="170" width="5" height="80" rx="1.5" fill="#18181b"/>
      <rect x="248.5" y="175" width="3" height="40" fill="#ffffff"/>
    </g>
    <g transform="rotate(130 250 250)">
      <line x1="250" y1="270" x2="250" y2="162" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="250" cy="175" r="2.5" fill="#ef4444"/>
    </g>
    <circle cx="250" cy="250" r="4" fill="#18181b"/>
  </g>
</svg>