<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="spShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="spSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="cocktailSunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
  </defs>

  <g filter="url(#spShadow)">
    <!-- 5-Row Polished Steel Bracelet -->
    <path d="M192,40 L308,40 L300,135 L200,135 Z" fill="url(#spSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="215" y1="40" x2="218" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="285" y1="40" x2="282" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="195" y1="75" x2="305" y2="75" stroke="#475569" stroke-width="2"/>
    <line x1="198" y1="110" x2="302" y2="110" stroke="#475569" stroke-width="2"/>

    <path d="M200,365 L300,365 L308,460 L192,460 Z" fill="url(#spSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="218" y1="365" x2="215" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="282" y1="365" x2="285" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="198" y1="395" x2="302" y2="395" stroke="#475569" stroke-width="2"/>
    <line x1="195" y1="425" x2="305" y2="425" stroke="#475569" stroke-width="2"/>

    <!-- Round Polished Case -->
    <circle cx="250" cy="250" r="126" fill="url(#spSteel)" stroke="#475569" stroke-width="2"/>

    <!-- Conical Fluted Crown at 3 o'clock -->
    <polygon points="370,240 380,243 380,257 370,260" fill="url(#spSteel)" stroke="#334155" stroke-width="1"/>

    <!-- Polished Bezel Ring -->
    <circle cx="250" cy="250" r="118" fill="url(#spSteel)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Stunning Pressed Radial Sunburst Dial (Cocktail Glass Guilloché) -->
    <circle cx="250" cy="250" r="110" fill="url(#cocktailSunburst)"/>

    <!-- Guilloché Ray Lines Radiating outward -->
    <!-- 24 sunburst lines -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="1">
      <line x1="250" y1="250" x2="250" y2="142"/>
      <line x1="250" y1="250" x2="278" y2="145"/>
      <line x1="250" y1="250" x2="305" y2="157"/>
      <line x1="250" y1="250" x2="327" y2="173"/>
      <line x1="250" y1="250" x2="345" y2="195"/>
      <line x1="250" y1="250" x2="355" y2="222"/>
      <line x1="250" y1="250" x2="358" y2="250"/>
      <line x1="250" y1="250" x2="355" y2="278"/>
      <line x1="250" y1="250" x2="345" y2="305"/>
      <line x1="250" y1="250" x2="327" y2="327"/>
      <line x1="250" y1="250" x2="305" y2="343"/>
      <line x1="250" y1="250" x2="278" y2="355"/>
      <line x1="250" y1="250" x2="250" y2="358"/>
      <line x1="250" y1="250" x2="222" y2="355"/>
      <line x1="250" y1="250" x2="195" y2="343"/>
      <line x1="250" y1="250" x2="173" y2="327"/>
      <line x1="250" y1="250" x2="155" y2="305"/>
      <line x1="250" y1="250" x2="145" y2="278"/>
      <line x1="250" y1="250" x2="142" y2="250"/>
      <line x1="250" y1="250" x2="145" y2="222"/>
      <line x1="250" y1="250" x2="155" y2="195"/>
      <line x1="250" y1="250" x2="173" y2="173"/>
      <line x1="250" y1="250" x2="195" y2="157"/>
      <line x1="250" y1="250" x2="222" y2="145"/>
    </g>

    <!-- Faceted Spear-Shaped Indices -->
    <!-- 12 Double Spear -->
    <polygon points="247,146 244,170 250,165" fill="#f8fafc"/>
    <polygon points="253,146 256,170 250,165" fill="#f8fafc"/>
    <!-- 6 & 9 -->
    <polygon points="250,354 246,330 254,330" fill="#f8fafc"/>
    <polygon points="146,250 170,246 170,254" fill="#f8fafc"/>
    <!-- Hour Indices -->
    <polygon points="305,160 293,180 298,184" fill="#f8fafc"/>
    <polygon points="340,195 320,207 324,212" fill="#f8fafc"/>
    <polygon points="340,305 320,293 324,288" fill="#f8fafc"/>
    <polygon points="305,340 293,320 298,316" fill="#f8fafc"/>
    <polygon points="195,340 207,320 202,316" fill="#f8fafc"/>
    <polygon points="160,305 180,293 176,288" fill="#f8fafc"/>
    <polygon points="160,195 180,207 176,212" fill="#f8fafc"/>
    <polygon points="195,160 207,180 202,184" fill="#f8fafc"/>

    <!-- Date Window at 3 o'clock with Silver Frame -->
    <rect x="320" y="240" width="22" height="20" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="331" y="255" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">8</text>

    <!-- Wordmark & Movement -->
    <text x="250" y="205" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SEIKO</text>
    <text x="250" y="217" font-family="'Times New Roman', serif" font-size="8" font-style="italic" fill="#e0f2fe" text-anchor="middle">Presage</text>
    <text x="250" y="295" font-family="'Helvetica Neue', sans-serif" font-size="5" fill="#e0f2fe" text-anchor="middle" letter-spacing="0.5">AUTOMATIC</text>

    <!-- Razor-Sharp Faceted Dauphine Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-60 250 250)">
      <polygon points="248,250 245,190 250,180 250,250" fill="#f8fafc"/>
      <polygon points="252,250 255,190 250,180 250,250" fill="#94a3b8"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(65 250 250)">
      <polygon points="248,250 245,160 250,150 250,250" fill="#f8fafc"/>
      <polygon points="252,250 255,160 250,150 250,250" fill="#94a3b8"/>
    </g>
    <!-- Slender Seconds Hand with Crescent Moon Counterweight -->
    <g transform="rotate(130 250 250)">
      <line x1="250" y1="270" x2="250" y2="148" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="250" cy="265" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <circle cx="250" cy="250" r="4" fill="#cbd5e1"/>
  </g>
</svg>