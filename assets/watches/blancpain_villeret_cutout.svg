<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="bpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="villeretGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="villeretSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#bpShadow)">
    <!-- Black Alligator Strap -->
    <rect x="195" y="40" width="110" height="115" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.5"/>
    <rect x="195" y="345" width="110" height="115" rx="4" fill="#18181b" stroke="#09090b" stroke-width="1.5"/>

    <!-- Signature "Double Pomme" (Double-Stepped) Bezel Case -->
    <circle cx="250" cy="250" r="128" fill="url(#villeretSteel)" stroke="#475569" stroke-width="2"/>
    <!-- Outer Step Ring -->
    <circle cx="250" cy="250" r="122" fill="url(#villeretSteel)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Inner Step Ring -->
    <circle cx="250" cy="250" r="116" fill="url(#villeretSteel)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Crown with Blancpain 'IB' Logo -->
    <rect x="374" y="243" width="10" height="14" rx="2" fill="url(#villeretSteel)" stroke="#334155" stroke-width="1"/>

    <!-- Grand Feu Opaline White Dial -->
    <circle cx="250" cy="250" r="110" fill="#fafafa"/>

    <!-- Applied Roman Numeral Appliques -->
    <text x="250" y="160" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">XII</text>
    <text x="250" y="352" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">VI</text>
    <text x="154" y="256" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">IX</text>
    <text x="295" y="172" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">I</text>
    <text x="330" y="202" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">II</text>
    <text x="330" y="298" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">IIII</text>
    <text x="295" y="335" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">V</text>
    <text x="205" y="335" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">VII</text>
    <text x="170" y="298" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">VIII</text>
    <text x="170" y="202" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">X</text>
    <text x="205" y="172" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">XI</text>

    <!-- Date Window at 3 o'clock -->
    <rect x="320" y="242" width="20" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="330" y="254" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">17</text>

    <!-- Blancpain Wordmark -->
    <text x="250" y="210" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">BLANCPAIN</text>
    <text x="250" y="222" font-family="'Times New Roman', serif" font-size="6" fill="#64748b" text-anchor="middle" letter-spacing="1">VILLERET · JB 1735</text>

    <!-- Openworked Cutout Sage-Leaf (Feuille) Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-60 250 250)">
      <path d="M250,250 Q243,215 250,195 Q257,215 250,250 Z" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(65 250 250)">
      <path d="M250,250 Q244,195 250,165 Q256,195 250,250 Z" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    </g>
    <circle cx="250" cy="250" r="4" fill="#1e293b"/>
  </g>
</svg>