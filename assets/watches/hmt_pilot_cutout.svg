<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="hmtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="hmtCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hmtLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <g filter="url(#hmtShadow)">
    <!-- Black Leather Strap with White Contrast Stitching -->
    <rect x="195" y="40" width="110" height="115" rx="3" fill="url(#hmtLeather)" stroke="#27272a" stroke-width="1"/>
    <line x1="202" y1="40" x2="202" y2="150" stroke="#f4f4f5" stroke-width="1.5" stroke-dasharray="3, 3"/>
    <line x1="298" y1="40" x2="298" y2="150" stroke="#f4f4f5" stroke-width="1.5" stroke-dasharray="3, 3"/>

    <rect x="195" y="345" width="110" height="115" rx="3" fill="url(#hmtLeather)" stroke="#27272a" stroke-width="1"/>
    <line x1="202" y1="350" x2="202" y2="460" stroke="#f4f4f5" stroke-width="1.5" stroke-dasharray="3, 3"/>
    <line x1="298" y1="350" x2="298" y2="460" stroke="#f4f4f5" stroke-width="1.5" stroke-dasharray="3, 3"/>

    <!-- 35mm Satin Finished Steel Case -->
    <circle cx="250" cy="250" r="126" fill="url(#hmtCase)" stroke="#475569" stroke-width="2"/>
    <!-- Fluted Mechanical Crown at 3 o'clock -->
    <rect x="372" y="240" width="12" height="20" rx="2" fill="url(#hmtCase)" stroke="#334155" stroke-width="1"/>

    <!-- Domed Acrylic Bezel -->
    <circle cx="250" cy="250" r="116" fill="url(#hmtCase)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Pure Matte Black Dial -->
    <circle cx="250" cy="250" r="108" fill="#111111"/>

    <!-- Outer Minute Track with Luminous Pips -->
    <circle cx="250" cy="250" r="104" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-dasharray="1.5, 3.8"/>

    <!-- Luminous Green Arabic Numerals (Famous HMT Pilot Font) -->
    <text x="250" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#86efac" text-anchor="middle">12</text>
    <text x="250" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#86efac" text-anchor="middle">6</text>
    <text x="340" y="257" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#86efac" text-anchor="middle">3</text>
    <text x="160" y="257" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#86efac" text-anchor="middle">9</text>
    <text x="298" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">1</text>
    <text x="330" y="213" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">2</text>
    <text x="330" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">4</text>
    <text x="298" y="337" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">5</text>
    <text x="202" y="337" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">7</text>
    <text x="170" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">8</text>
    <text x="170" y="213" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">10</text>
    <text x="202" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">11</text>

    <!-- Dial Inscription: hmt logo & PILOT -->
    <text x="250" y="205" font-family="'Brush Script MT', cursive, sans-serif" font-style="italic" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">hmt</text>
    <text x="250" y="220" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PILOT</text>
    <text x="250" y="285" font-family="'Helvetica Neue', sans-serif" font-size="6" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">17 JEWELS</text>
    <text x="250" y="294" font-family="'Helvetica Neue', sans-serif" font-size="5" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">PARASHOCK</text>

    <!-- Luminous Sword Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-65 250 250)">
      <polygon points="247,250 247,195 250,185 253,195 253,250" fill="#86efac" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(50 250 250)">
      <polygon points="248,250 248,168 250,158 252,168 252,250" fill="#86efac" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <!-- Striking Red Central Seconds Hand -->
    <g transform="rotate(135 250 250)">
      <line x1="250" y1="270" x2="250" y2="152" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="250" cy="265" r="2" fill="#ef4444"/>
    </g>
    <circle cx="250" cy="250" r="4" fill="#cbd5e1"/>
  </g>
</svg>