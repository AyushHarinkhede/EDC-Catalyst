<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="gwShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="armorAluminum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="35%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <g filter="url(#gwShadow)">
    <!-- Graphite Sport T-Buckle Band -->
    <path d="M195,40 L305,40 L300,135 L200,135 Z" fill="#27272a" stroke="#18181b" stroke-width="1.5"/>
    <path d="M200,365 L300,365 L305,460 L195,460 Z" fill="#27272a" stroke="#18181b" stroke-width="1.5"/>

    <!-- Armor Aluminum Circular Case -->
    <circle cx="250" cy="250" r="126" fill="url(#armorAluminum)" stroke="#18181b" stroke-width="2"/>

    <!-- Dual Flush Side Buttons (Home button with red accent ring & Back) -->
    <rect x="368" y="215" width="8" height="24" rx="3" fill="#27272a" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="368" y="260" width="8" height="24" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>

    <!-- Ultra-Slim 20% Thinner Black Bezel -->
    <circle cx="250" cy="250" r="122" fill="#000000" stroke="#27272a" stroke-width="1"/>

    <!-- 1.5" Vibrant Super AMOLED Screen -->
    <circle cx="250" cy="250" r="115" fill="#000000"/>

    <!-- Galaxy Watch One UI Digital Watch Face -->
    <!-- Activity Rings (Calories Pink, Exercise Yellow, Stand Cyan) -->
    <circle cx="250" cy="250" r="95" fill="none" stroke="rgba(244,63,94,0.2)" stroke-width="6"/>
    <circle cx="250" cy="250" r="95" fill="none" stroke="#f43f5e" stroke-width="6" stroke-dasharray="240, 600" stroke-linecap="round"/>

    <circle cx="250" cy="250" r="85" fill="none" stroke="rgba(250,204,21,0.2)" stroke-width="6"/>
    <circle cx="250" cy="250" r="85" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="200, 600" stroke-linecap="round"/>

    <circle cx="250" cy="250" r="75" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="6"/>
    <circle cx="250" cy="250" r="75" fill="none" stroke="#06b6d4" stroke-width="6" stroke-dasharray="280, 600" stroke-linecap="round"/>

    <!-- Center Bold Digital Clock -->
    <text x="250" y="235" font-family="'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">10:08</text>
    <text x="250" y="255" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#a1a1aa" text-anchor="middle">FRI, OCT 24</text>

    <!-- Complications: Battery & Weather -->
    <g transform="translate(210, 275)">
      <!-- Battery icon -->
      <rect x="0" y="2" width="16" height="9" rx="2" fill="none" stroke="#22c55e" stroke-width="1.2"/>
      <rect x="2" y="4" width="10" height="5" fill="#22c55e"/>
      <text x="22" y="11" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">85%</text>
      <!-- Heart icon -->
      <text x="56" y="11" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f43f5e">♥ 72</text>
    </g>
  </g>
</svg>