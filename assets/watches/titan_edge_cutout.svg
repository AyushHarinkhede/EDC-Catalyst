<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="teShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="edgeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="edgeDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <g filter="url(#teShadow)">
    <!-- Ultra-Slim Integrated Steel Mesh Bracelet -->
    <path d="M196,40 L304,40 L300,135 L200,135 Z" fill="url(#edgeSteel)" stroke="#475569" stroke-width="1.2"/>
    <line x1="198" y1="70" x2="302" y2="70" stroke="#64748b" stroke-width="1.5"/>
    <line x1="199" y1="105" x2="301" y2="105" stroke="#64748b" stroke-width="1.5"/>

    <path d="M200,365 L300,365 L304,460 L196,460 Z" fill="url(#edgeSteel)" stroke="#475569" stroke-width="1.2"/>
    <line x1="199" y1="395" x2="301" y2="395" stroke="#64748b" stroke-width="1.5"/>
    <line x1="198" y1="430" x2="302" y2="430" stroke="#64748b" stroke-width="1.5"/>

    <!-- 3.99mm Wafer-Thin Case Profile -->
    <circle cx="250" cy="250" r="126" fill="url(#edgeSteel)" stroke="#334155" stroke-width="1.5"/>
    <!-- Micro-slim Crown -->
    <rect x="372" y="246" width="6" height="8" rx="1.5" fill="url(#edgeSteel)"/>

    <!-- Minimalist Razor-Thin Bezel -->
    <circle cx="250" cy="250" r="121" fill="url(#edgeSteel)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Midnight Sunburst Dial -->
    <circle cx="250" cy="250" r="116" fill="url(#edgeDial)"/>

    <!-- Architectural Ultra-Thin Silver Baton Indices -->
    <line x1="250" y1="140" x2="250" y2="155" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="250" y1="345" x2="250" y2="360" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="140" y1="250" x2="155" y2="250" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="345" y1="250" x2="360" y2="250" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="305" y1="160" x2="295" y2="170" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="340" y1="195" x2="330" y2="205" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="340" y1="305" x2="330" y2="295" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="305" y1="340" x2="295" y2="330" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="195" y1="340" x2="205" y2="330" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="160" y1="305" x2="170" y2="295" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="160" y1="195" x2="170" y2="205" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="195" y1="160" x2="205" y2="170" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- TITAN EDGE Logo -->
    <text x="250" y="200" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">TITAN</text>
    <text x="250" y="214" font-family="'Helvetica Neue', sans-serif" font-size="7" font-weight="300" fill="#38bdf8" text-anchor="middle" letter-spacing="3">EDGE</text>

    <!-- Needle-Thin Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-65 250 250)">
      <line x1="250" y1="250" x2="250" y2="185" stroke="#ffffff" stroke-width="2"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(50 250 250)">
      <line x1="250" y1="250" x2="250" y2="155" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <circle cx="250" cy="250" r="3" fill="#ffffff"/>
  </g>
</svg>