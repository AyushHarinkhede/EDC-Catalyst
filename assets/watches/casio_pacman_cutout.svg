<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="pmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="goldVintage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <g filter="url(#pmShadow)">
    <!-- Gold Mesh Bracelet -->
    <path d="M190,40 L310,40 L300,130 L200,130 Z" fill="url(#goldVintage)" stroke="#a16207" stroke-width="1.5"/>
    <line x1="193" y1="70" x2="307" y2="70" stroke="#78350f" stroke-width="1.5"/>
    <line x1="196" y1="100" x2="304" y2="100" stroke="#78350f" stroke-width="1.5"/>

    <path d="M200,370 L300,370 L310,460 L190,460 Z" fill="url(#goldVintage)" stroke="#a16207" stroke-width="1.5"/>
    <line x1="196" y1="400" x2="304" y2="400" stroke="#78350f" stroke-width="1.5"/>
    <line x1="193" y1="430" x2="307" y2="430" stroke="#78350f" stroke-width="1.5"/>

    <!-- Gold Vintage Case -->
    <rect x="160" y="120" width="180" height="260" rx="20" fill="url(#goldVintage)" stroke="#78350f" stroke-width="2"/>

    <!-- Arcade Black Glass Bezel -->
    <rect x="175" y="135" width="150" height="230" rx="12" fill="#000000" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Pac-Man Arcade Maze Graphic Tracks (Electric Blue Border Lines) -->
    <path d="M185,150 L315,150 L315,190 L185,190 Z" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M185,310 L315,310 L315,350 L185,350 Z" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- Pac-Man Eating Dots -->
    <circle cx="210" cy="170" r="2.5" fill="#fef08a"/>
    <circle cx="225" cy="170" r="2.5" fill="#fef08a"/>
    <circle cx="240" cy="170" r="2.5" fill="#fef08a"/>
    <!-- Yellow Pac-Man character with open mouth -->
    <path d="M260,170 L272,163 A8,8 0 1,0 272,177 Z" fill="#facc15"/>

    <!-- Ghost Characters (Blinky Red & Clyde Orange) -->
    <!-- Blinky -->
    <path d="M290,174 L290,165 A5,5 0 0,1 300,165 L300,174 L297,171 L295,174 L292,171 Z" fill="#ef4444"/>
    <circle cx="293" cy="165" r="1.5" fill="#ffffff"/>
    <circle cx="297" cy="165" r="1.5" fill="#ffffff"/>

    <!-- Clyde -->
    <path d="M200,334 L200,325 A5,5 0 0,1 210,325 L210,334 L207,331 L205,334 L202,331 Z" fill="#f97316"/>

    <!-- Cherries Power-up -->
    <circle cx="300" cy="330" r="3" fill="#dc2626"/>
    <circle cx="305" cy="333" r="3" fill="#dc2626"/>
    <path d="M300,330 Q303,322 305,320 M305,333 Q304,324 305,320" stroke="#16a34a" stroke-width="1.2"/>

    <!-- Wordmarks -->
    <text x="250" y="148" font-family="'Helvetica Neue', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CASIO</text>
    <text x="250" y="362" font-family="'Press Start 2P', cursive, sans-serif" font-size="7" font-weight="bold" fill="#facc15" text-anchor="middle">PAC-MAN</text>

    <!-- Central LCD Digital Display -->
    <rect x="188" y="210" width="124" height="85" rx="4" fill="#fef08a" opacity="0.9" stroke="#333" stroke-width="1"/>
    <!-- Header -->
    <text x="198" y="228" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#111">STEP 8420</text>
    <text x="282" y="228" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#111">FR 28</text>
    <!-- Digital Clock -->
    <text x="195" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#0a0a0a" letter-spacing="-1">12:45</text>
    <text x="290" y="260" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#0a0a0a">06</text>
  </g>
</svg>