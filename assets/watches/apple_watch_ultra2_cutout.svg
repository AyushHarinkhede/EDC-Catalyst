<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="awuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
    <linearGradient id="naturalTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#awuShadow)">
    <!-- Orange Alpine Loop Band -->
    <path d="M190,40 L310,40 L305,120 L195,120 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
    <line x1="192" y1="70" x2="308" y2="70" stroke="#9a3412" stroke-width="3"/>
    <line x1="194" y1="95" x2="306" y2="95" stroke="#9a3412" stroke-width="3"/>

    <path d="M195,380 L305,380 L310,460 L190,460 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
    <line x1="194" y1="405" x2="306" y2="405" stroke="#9a3412" stroke-width="3"/>
    <line x1="192" y1="430" x2="308" y2="430" stroke="#9a3412" stroke-width="3"/>

    <!-- 49mm Aerospace Titanium Robust Squircle Case -->
    <rect x="150" y="110" width="200" height="280" rx="48" fill="url(#naturalTitanium)" stroke="#475569" stroke-width="2"/>

    <!-- Left Side: International Orange Action Button & Dual Speaker Siren Grille -->
    <rect x="142" y="180" width="10" height="52" rx="4" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
    <g fill="#1e293b">
      <circle cx="146" cy="255" r="2"/>
      <circle cx="146" cy="265" r="2"/>
      <circle cx="146" cy="275" r="2"/>
      <circle cx="146" cy="285" r="2"/>
    </g>

    <!-- Right Side: Raised Crown Guard enclosing Digital Crown & Flush Button -->
    <path d="M350,170 C364,170 368,180 368,195 L368,305 C368,320 364,330 350,330 Z" fill="url(#naturalTitanium)" stroke="#475569" stroke-width="1.5"/>
    <!-- Knurled Digital Crown with International Orange Accent Ring -->
    <rect x="360" y="180" width="16" height="42" rx="4" fill="#334155" stroke="#ea580c" stroke-width="2"/>
    <line x1="364" y1="180" x2="364" y2="222" stroke="#64748b" stroke-width="1.5"/>
    <line x1="368" y1="180" x2="368" y2="222" stroke="#64748b" stroke-width="1.5"/>
    <line x1="372" y1="180" x2="372" y2="222" stroke="#64748b" stroke-width="1.5"/>
    <!-- Flush Side Button -->
    <rect x="362" y="245" width="8" height="50" rx="3" fill="#1e293b"/>

    <!-- Raised Flat Sapphire Crystal Lip -->
    <rect x="166" y="126" width="168" height="248" rx="38" fill="none" stroke="url(#naturalTitanium)" stroke-width="3.5"/>

    <!-- 3000-Nit OLED Display (Modular Ultra Watch Face) -->
    <rect x="170" y="130" width="160" height="240" rx="34" fill="#000000"/>

    <!-- Perimeter Seconds & Depth Ring -->
    <rect x="176" y="136" width="148" height="228" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2, 5"/>

    <!-- Modular Ultra Time & Complications Display -->
    <text x="186" y="160" font-family="sans-serif" font-size="11" font-weight="900" fill="#f97316">3,240 FT</text>
    <text x="312" y="160" font-family="sans-serif" font-size="11" font-weight="900" fill="#38bdf8">14° N</text>

    <!-- Digital Clock (Giant Modular Ultra Font) -->
    <text x="250" y="222" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">09:41</text>
    <text x="310" y="195" font-family="sans-serif" font-size="14" font-weight="900" fill="#f97316">58</text>

    <!-- Compass & Activity Ring Complications -->
    <rect x="186" y="240" width="128" height="40" rx="8" fill="#18181b"/>
    <text x="250" y="264" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4ade80" text-anchor="middle">540 CAL · 45 MIN</text>

    <!-- Bottom Depth Gauge Complication -->
    <rect x="186" y="295" width="128" height="58" rx="8" fill="#18181b"/>
    <text x="250" y="322" font-family="sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">0.0 FT</text>
    <text x="250" y="340" font-family="sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">WATER TEMPERATURE 72°</text>
  </g>
</svg>