<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="czShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="czSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="czStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <g filter="url(#czShadow)">
    <!-- Accordion Wave Polyurethane Dive Strap -->
    <rect x="190" y="40" width="120" height="115" rx="4" fill="url(#czStrap)" stroke="#111" stroke-width="1.5"/>
    <!-- Accordion expansion ridges -->
    <rect x="190" y="65" width="120" height="8" rx="4" fill="#374151"/>
    <rect x="190" y="85" width="120" height="8" rx="4" fill="#374151"/>

    <rect x="190" y="345" width="120" height="115" rx="4" fill="url(#czStrap)" stroke="#111" stroke-width="1.5"/>
    <rect x="190" y="375" width="120" height="8" rx="4" fill="#374151"/>
    <rect x="190" y="395" width="120" height="8" rx="4" fill="#374151"/>

    <!-- Rugged 44mm Steel Case -->
    <circle cx="250" cy="250" r="128" fill="url(#czSteel)" stroke="#334155" stroke-width="2"/>

    <!-- Offset 4 o'clock Screw-Down Crown with Crown Guards -->
    <path d="M335,320 L355,340 L345,350 L325,330 Z" fill="url(#czSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="345" cy="338" r="7" fill="#1e293b" stroke="url(#czSteel)" stroke-width="1"/>

    <!-- 60-Minute Unidirectional Bezel with Heavy Knurled Teeth -->
    <circle cx="250" cy="250" r="122" fill="#111827" stroke="url(#czSteel)" stroke-width="3"/>
    <circle cx="250" cy="250" r="92" fill="#09090b" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Bezel Markings (10, 20, 30, 40, 50 & 12 Triangle with Lume Pip) -->
    <polygon points="250,132 242,143 258,143" fill="#ffffff"/>
    <circle cx="250" cy="140" r="3" fill="#22c55e"/>
    <text x="312" y="165" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="350" y="235" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>
    <text x="335" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">30</text>
    <text x="250" y="360" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">40</text>
    <text x="165" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">50</text>

    <!-- Solar Eco-Drive Dial -->
    <circle cx="250" cy="250" r="90" fill="#09090b"/>

    <!-- Trapezoid and Round Luminous Markers (High-Intensity Blue/Green Lume) -->
    <!-- 12 o'clock Promaster Double Trapezoid -->
    <polygon points="243,165 240,180 248,180 248,165" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <polygon points="257,165 260,180 252,180 252,165" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <!-- 6 & 9 Trapezoids -->
    <polygon points="243,335 240,320 260,320 257,335" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <polygon points="165,243 180,240 180,260 165,257" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Round Markers -->
    <circle cx="295" cy="176" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="324" cy="205" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="324" cy="295" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="295" cy="324" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="205" cy="324" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="176" cy="295" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="176" cy="205" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="205" cy="176" r="6.5" fill="#4ade80" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Date at 4 o'clock -->
    <rect x="306" y="268" width="18" height="16" rx="2" fill="#ffffff"/>
    <text x="315" y="280" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">24</text>

    <!-- Dial Inscriptions -->
    <text x="250" y="206" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">CITIZEN</text>
    <text x="250" y="218" font-family="'Helvetica Neue', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">Eco-Drive</text>
    <text x="250" y="295" font-family="'Helvetica Neue', sans-serif" font-size="6" font-weight="bold" fill="#38bdf8" text-anchor="middle">DIVER'S 200m</text>

    <!-- Broad Orange Plongeur Minute Hand (High-Contrast Dive Arrow) -->
    <g transform="rotate(65 250 250)">
      <polygon points="246,250 245,170 240,165 250,150 260,165 255,170 254,250" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
      <polygon points="248,168 250,158 252,168" fill="#4ade80"/>
    </g>
    <!-- Broad White Hour Hand -->
    <g transform="rotate(-60 250 250)">
      <polygon points="246,250 246,195 250,185 254,195 254,250" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <polygon points="248,193 250,187 252,193" fill="#4ade80"/>
    </g>
    <circle cx="250" cy="250" r="4.5" fill="#f97316"/>
  </g>
</svg>