<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="tsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="tissotSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <g filter="url(#tsShadow)">
    <!-- Alligator Embossed Leather Strap -->
    <rect x="195" y="40" width="110" height="115" rx="4" fill="#262626" stroke="#171717" stroke-width="1.5"/>
    <rect x="195" y="345" width="110" height="115" rx="4" fill="#262626" stroke="#171717" stroke-width="1.5"/>

    <!-- 42mm Polished Steel Case -->
    <circle cx="250" cy="250" r="126" fill="url(#tissotSteel)" stroke="#475569" stroke-width="2"/>
    <circle cx="250" cy="250" r="118" fill="url(#tissotSteel)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Crown -->
    <rect x="372" y="240" width="12" height="20" rx="3" fill="url(#tissotSteel)" stroke="#334155" stroke-width="1"/>
    <text x="378" y="254" font-family="'Helvetica Neue', sans-serif" font-size="8" font-weight="900" fill="#dc2626" text-anchor="middle">T</text>

    <!-- Openworked Skeleton Movement Behind Crystal -->
    <circle cx="250" cy="250" r="110" fill="#18181b"/>

    <!-- Exposed Gear Trains & Balance Wheel -->
    <!-- Balance Wheel at 12 o'clock -->
    <circle cx="250" cy="190" r="22" fill="none" stroke="url(#gearGold)" stroke-width="3"/>
    <circle cx="250" cy="190" r="6" fill="#dc2626"/>
    <!-- Mainspring Barrel & Gears -->
    <circle cx="215" cy="270" r="28" fill="none" stroke="url(#gearGold)" stroke-width="4" stroke-dasharray="3, 3"/>
    <circle cx="285" cy="270" r="26" fill="none" stroke="url(#tissotSteel)" stroke-width="4" stroke-dasharray="3, 3"/>
    <circle cx="250" cy="250" r="14" fill="none" stroke="url(#gearGold)" stroke-width="2"/>

    <!-- Outer Anthracite Roman Numeral Chapter Ring -->
    <circle cx="250" cy="250" r="110" fill="none" stroke="#27272a" stroke-width="28"/>
    <circle cx="250" cy="250" r="110" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="250" cy="250" r="82" fill="none" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Roman Numerals on Chapter Ring -->
    <text x="250" y="156" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">XII</text>
    <text x="250" y="356" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">VI</text>
    <text x="150" y="256" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">IX</text>
    <text x="350" y="256" font-family="'Times New Roman', serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">III</text>

    <!-- Tissot Wordmark Plaque -->
    <rect x="215" y="222" width="70" height="18" rx="2" fill="#18181b" stroke="#64748b" stroke-width="1"/>
    <text x="250" y="234" font-family="'Helvetica Neue', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">TISSOT</text>

    <!-- Blued-Steel Faceted Dauphine Hands -->
    <g transform="rotate(-60 250 250)">
      <polygon points="247,250 245,190 250,180 255,190 253,250" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    </g>
    <g transform="rotate(65 250 250)">
      <polygon points="247.5,250 246,160 250,150 254,160 252.5,250" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
    </g>
    <circle cx="250" cy="250" r="4.5" fill="#2563eb"/>
  </g>
</svg>