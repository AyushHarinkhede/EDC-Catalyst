<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="bbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="bbSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#bbShadow)">
    <!-- 3-Row Rounded Link Steel Bracelet -->
    <path d="M195,40 L305,40 L300,135 L200,135 Z" fill="url(#bbSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="230" y1="40" x2="230" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="270" y1="40" x2="270" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="197" y1="80" x2="303" y2="80" stroke="#475569" stroke-width="2"/>
    <line x1="199" y1="110" x2="301" y2="110" stroke="#475569" stroke-width="2"/>

    <path d="M200,365 L300,365 L305,460 L195,460 Z" fill="url(#bbSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="230" y1="365" x2="230" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="270" y1="365" x2="270" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="199" y1="390" x2="301" y2="390" stroke="#475569" stroke-width="2"/>
    <line x1="197" y1="420" x2="303" y2="420" stroke="#475569" stroke-width="2"/>

    <!-- Double-Convex Round Pebble Case -->
    <circle cx="250" cy="250" r="126" fill="url(#bbSteel)" stroke="#475569" stroke-width="2"/>

    <!-- Signature Integrated Crown Loop at 3 o'clock -->
    <!-- Protective Metallic Arch -->
    <path d="M346,220 C368,230 368,270 346,280 C360,265 360,235 346,220 Z" fill="url(#bbSteel)" stroke="#334155" stroke-width="1.5"/>
    <!-- Blue Cabochon Crown inside loop -->
    <circle cx="348" cy="250" r="8" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="1"/>

    <!-- Silvered Guilloché Sunray Dial -->
    <circle cx="250" cy="250" r="112" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Outer Roman Numeral Ring (curved around the 3 o'clock crown indentation) -->
    <path d="M334,228 C322,238 322,262 334,272" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- Roman Numerals -->
    <text x="250" y="160" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">XII</text>
    <text x="250" y="352" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">VI</text>
    <text x="156" y="256" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">IX</text>
    <text x="295" y="172" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">I</text>
    <text x="330" y="202" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">II</text>
    <text x="328" y="298" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">IIII</text>
    <text x="295" y="335" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">V</text>
    <text x="205" y="335" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">VII</text>
    <text x="170" y="298" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">VIII</text>
    <text x="170" y="202" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">X</text>
    <text x="205" y="172" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">XI</text>

    <!-- Central Guilloché Rosette Pattern -->
    <circle cx="250" cy="250" r="60" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="250" cy="250" r="45" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="250" cy="250" r="30" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>

    <!-- Cartier Wordmark -->
    <text x="250" y="215" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle" letter-spacing="1.5">Cartier</text>
    <text x="250" y="285" font-family="'Times New Roman', serif" font-size="7" fill="#64748b" text-anchor="middle" letter-spacing="1">AUTOMATIC</text>

    <!-- Blued-Steel Sword Hands -->
    <!-- Hour Hand -->
    <g transform="rotate(-55 250 250)">
      <polygon points="248,250 248,202 250,195 252,202 252,250" fill="#1e3a8a"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(50 250 250)">
      <polygon points="248.5,250 248.5,178 250,170 251.5,178 251.5,250" fill="#1e3a8a"/>
    </g>
    <!-- Central Blued Seconds Hand -->
    <g transform="rotate(135 250 250)">
      <line x1="250" y1="265" x2="250" y2="160" stroke="#1d4ed8" stroke-width="1"/>
      <circle cx="250" cy="260" r="2" fill="#1d4ed8"/>
    </g>
    <circle cx="250" cy="250" r="3.5" fill="#1e3a8a"/>
  </g>
</svg>