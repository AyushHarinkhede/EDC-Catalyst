<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="rShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.4" flood-color="#000000"/>
    </filter>
    <linearGradient id="oysterSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cerachrom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cyclopsGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <g filter="url(#rShadow)">
    <!-- Oyster Bracelet (Top & Bottom Links) -->
    <!-- Top Bracelet -->
    <path d="M190,40 L310,40 L300,140 L200,140 Z" fill="url(#oysterSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="225" y1="40" x2="230" y2="140" stroke="#64748b" stroke-width="1.5"/>
    <line x1="275" y1="40" x2="270" y2="140" stroke="#64748b" stroke-width="1.5"/>
    <line x1="193" y1="80" x2="307" y2="80" stroke="#475569" stroke-width="2"/>
    <line x1="196" y1="115" x2="304" y2="115" stroke="#475569" stroke-width="2"/>

    <!-- Bottom Bracelet -->
    <path d="M200,360 L300,360 L310,460 L190,460 Z" fill="url(#oysterSteel)" stroke="#334155" stroke-width="1.5"/>
    <line x1="230" y1="360" x2="225" y2="460" stroke="#64748b" stroke-width="1.5"/>
    <line x1="270" y1="360" x2="275" y2="460" stroke="#64748b" stroke-width="1.5"/>
    <line x1="196" y1="385" x2="304" y2="385" stroke="#475569" stroke-width="2"/>
    <line x1="193" y1="420" x2="307" y2="420" stroke="#475569" stroke-width="2"/>

    <!-- Oyster Case Lugs -->
    <path d="M165,140 C165,110 200,100 250,100 C300,100 335,110 335,140 L335,360 C335,390 300,400 250,400 C200,400 165,390 165,360 Z" fill="url(#oysterSteel)" stroke="#475569" stroke-width="2"/>

    <!-- Triplock Screw-Down Crown Guards & Crown -->
    <path d="M335,230 L360,235 L360,265 L335,270 Z" fill="url(#oysterSteel)"/>
    <rect x="355" y="238" width="16" height="24" rx="3" fill="url(#oysterSteel)" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="238" x2="360" y2="262" stroke="#1e293b" stroke-width="1"/>
    <line x1="364" y1="238" x2="364" y2="262" stroke="#1e293b" stroke-width="1"/>
    <line x1="368" y1="238" x2="368" y2="262" stroke="#1e293b" stroke-width="1"/>
    <!-- Rolex Coronet on crown -->
    <circle cx="363" cy="250" r="1.5" fill="#1e293b"/>

    <!-- Fluted Bezel Ring Outer Edge -->
    <circle cx="250" cy="250" r="126" fill="url(#oysterSteel)" stroke="#334155" stroke-width="2"/>
    
    <!-- Cerachrom Ceramic Bezel Insert (Jet Black with Platinum Numerals) -->
    <circle cx="250" cy="250" r="120" fill="url(#cerachrom)" stroke="#222" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="92" fill="#000000" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Bezel Markings (10, 20, 30, 40, 50 & 12 o'clock Triangle Pip) -->
    <!-- 12 Triangle with Luminous Pearl -->
    <polygon points="250,133 242,143 258,143" fill="#cbd5e1"/>
    <circle cx="250" cy="140" r="3" fill="#e2e8f0" stroke="#38bdf8" stroke-width="1"/>

    <!-- Bezel Numbers -->
    <text x="312" y="165" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">10</text>
    <text x="350" y="235" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">20</text>
    <text x="335" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">30</text>
    <text x="250" y="360" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">40</text>
    <text x="165" y="315" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">50</text>

    <!-- Dial (Gloss Black Maxi Dial) -->
    <circle cx="250" cy="250" r="90" fill="#050505"/>

    <!-- Minute Track -->
    <circle cx="250" cy="250" r="88" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="1, 4.2"/>

    <!-- Luminescent Hour Markers with White Gold Surrounds (Chromalight Blue Lume) -->
    <!-- 12 Triangle -->
    <polygon points="250,166 242,180 258,180" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- 6 & 9 Rectangles -->
    <rect x="245" y="318" width="10" height="16" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="166" y="245" width="16" height="10" rx="1.5" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Circles for 1, 2, 4, 5, 7, 8, 10, 11 -->
    <circle cx="295" cy="176" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="324" cy="205" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="324" cy="295" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="295" cy="324" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="205" cy="324" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="176" cy="295" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="176" cy="205" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="205" cy="176" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Date Window at 3 o'clock & Cyclops 2.5x Lens -->
    <rect x="316" y="240" width="18" height="20" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="325" y="255" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">28</text>
    <!-- Magnifying Cyclops Lens Bubble -->
    <rect x="312" y="235" width="26" height="30" rx="6" fill="url(#cyclopsGlint)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

    <!-- Dial Inscriptions -->
    <!-- Rolex Coronet -->
    <path d="M246,192 L248,197 L250,190 L252,197 L254,192 L253,200 L247,200 Z" fill="#e2e8f0"/>
    <circle cx="246" cy="191" r="0.8" fill="#e2e8f0"/>
    <circle cx="248" cy="195" r="0.8" fill="#e2e8f0"/>
    <circle cx="250" cy="189" r="0.8" fill="#e2e8f0"/>
    <circle cx="252" cy="195" r="0.8" fill="#e2e8f0"/>
    <circle cx="254" cy="191" r="0.8" fill="#e2e8f0"/>
    <text x="250" y="209" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ROLEX</text>
    <text x="250" y="217" font-family="'Helvetica Neue', sans-serif" font-size="4.5" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">OYSTER PERPETUAL DATE</text>

    <!-- Submariner text -->
    <text x="250" y="285" font-family="'Helvetica Neue', sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SUBMARINER</text>
    <text x="250" y="293" font-family="'Helvetica Neue', sans-serif" font-size="4" fill="#94a3b8" text-anchor="middle">1000<tspan font-size="3">ft</tspan> = 300<tspan font-size="3">m</tspan></text>
    <text x="250" y="299" font-family="'Helvetica Neue', sans-serif" font-size="3.5" fill="#e2e8f0" text-anchor="middle">SUPERLATIVE CHRONOMETER</text>
    <text x="250" y="304" font-family="'Helvetica Neue', sans-serif" font-size="3.5" fill="#e2e8f0" text-anchor="middle">OFFICIALLY CERTIFIED</text>

    <!-- Center Pinion & Hands -->
    <!-- Mercedes Hour Hand (pointing toward 10:10) -->
    <g transform="rotate(-60 250 250)">
      <rect x="247" y="195" width="6" height="55" rx="2" fill="#cbd5e1"/>
      <circle cx="250" cy="205" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Mercedes 3-point star divider -->
      <line x1="250" y1="205" x2="250" y2="198" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="250" y1="205" x2="244" y2="209" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="250" y1="205" x2="256" y2="209" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Sword Minute Hand (pointing toward 2 o'clock) -->
    <g transform="rotate(65 250 250)">
      <polygon points="247,250 248,170 250,165 252,170 253,250" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <!-- Lollipop Seconds Hand (with luminous circle) -->
    <g transform="rotate(130 250 250)">
      <line x1="250" y1="270" x2="250" y2="162" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="250" cy="180" r="4" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="250" cy="265" r="2.5" fill="#cbd5e1"/>
    </g>

    <!-- Center Cap -->
    <circle cx="250" cy="250" r="4.5" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  </g>
</svg>