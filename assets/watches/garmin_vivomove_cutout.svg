<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="gmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="slateCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roseGoldHands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <g filter="url(#gmShadow)">
    <!-- Slate Silicone Quick-Release Band -->
    <path d="M195,40 L305,40 L300,135 L200,135 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M200,365 L300,365 L305,460 L195,460 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Slate Stainless Steel Bezel & Composite Case -->
    <circle cx="250" cy="250" r="126" fill="url(#slateCase)" stroke="#1e293b" stroke-width="2"/>
    <circle cx="250" cy="250" r="118" fill="url(#slateCase)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Matte Slate Dial with Hidden Full-Dial Display -->
    <circle cx="250" cy="250" r="110" fill="#0f172a"/>

    <!-- Hidden Smart Display Elements Glowing Gently (Hybrid Touchscreen) -->
    <!-- Top Smart Card: Battery & Heart Rate -->
    <g transform="translate(210, 180)">
      <path d="M5,10 A4,4 0 0,1 15,6 A4,4 0 0,1 25,10 Q25,16 15,22 Q5,16 5,10 Z" fill="#f43f5e"/>
      <text x="32" y="18" font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">72 bpm</text>
    </g>

    <!-- Center Garmin Subtle Logo -->
    <text x="250" y="215" font-family="'Helvetica Neue', sans-serif" font-size="9" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="2">GARMIN</text>

    <!-- Bottom Smart Card: Step Progress Arc & Notification -->
    <path d="M200,285 A50,50 0 0,1 300,285" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="310" font-family="'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">8,450</text>
    <text x="250" y="322" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">STEPS GOAL</text>

    <!-- Physical Analog Ticking Hands in Rose Gold (Dynamic Smart Movement) -->
    <!-- Hour Hand -->
    <g transform="rotate(-40 250 250)">
      <polygon points="248,250 248,190 250,182 252,190 252,250" fill="url(#roseGoldHands)"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(40 250 250)">
      <polygon points="248.5,250 248.5,165 250,155 251.5,165 251.5,250" fill="url(#roseGoldHands)"/>
    </g>
    <circle cx="250" cy="250" r="4.5" fill="url(#roseGoldHands)"/>
  </g>
</svg>