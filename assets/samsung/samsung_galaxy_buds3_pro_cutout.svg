<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <filter id="buds3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="cyberSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <g filter="url(#buds3Shadow)">
    <!-- Transparent Smoked Top Lid Clamshell Case -->
    <rect x="130" y="100" width="240" height="200" rx="32" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="140" y="110" width="220" height="85" rx="22" fill="#1e293b" opacity="0.6" stroke="#64748b" stroke-width="1.5"/>

    <!-- Left Angular Blade Earbud -->
    <g transform="translate(180, 150)">
      <!-- Blade Stem (Triangular Prism Profile) -->
      <polygon points="10,20 28,10 24,95 8,90" fill="url(#cyberSilver)" stroke="#64748b" stroke-width="1.5"/>
      <!-- Glowing Blue LED Blade Light Strip -->
      <line x1="18" y1="25" x2="16" y2="85" stroke="#38bdf8" stroke-width="2.5" filter="drop-shadow(0 0 4px #0284c7)"/>
      <!-- Ergonomic In-Ear Audio Chamber -->
      <ellipse cx="20" cy="18" rx="18" ry="14" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Right Angular Blade Earbud -->
    <g transform="translate(265, 150)">
      <polygon points="10,10 28,20 24,90 8,95" fill="url(#cyberSilver)" stroke="#64748b" stroke-width="1.5"/>
      <line x1="18" y1="25" x2="16" y2="85" stroke="#38bdf8" stroke-width="2.5" filter="drop-shadow(0 0 4px #0284c7)"/>
      <ellipse cx="20" cy="18" rx="18" ry="14" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    </g>
  </g>
</svg>