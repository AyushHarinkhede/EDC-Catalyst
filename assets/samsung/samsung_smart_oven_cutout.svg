<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="sOvenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#sOvenShadow)">
    <rect x="90" y="70" width="320" height="360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Top LCD Touch Bar Panel -->
    <rect x="105" y="85" width="290" height="55" rx="4" fill="#020617"/>
    <text x="250" y="118" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">AIR FRY 200°C</text>

    <!-- Large Smoked Double Glass Door with Interior Glow -->
    <rect x="105" y="150" width="290" height="260" rx="6" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="135" y="180" width="230" height="180" rx="4" fill="#1e1b4b" opacity="0.4"/>
    <circle cx="250" cy="270" r="45" fill="#f59e0b" opacity="0.3" filter="blur(6px)"/>
    
    <!-- Slim Full-Width Metal Handle -->
    <rect x="115" y="155" width="270" height="10" rx="3" fill="#cbd5e1"/>
  </g>
</svg>