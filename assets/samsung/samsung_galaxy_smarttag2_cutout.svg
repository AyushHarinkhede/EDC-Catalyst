<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="100%" height="100%">
  <defs>
    <filter id="tag2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="tagWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <g filter="url(#tag2Shadow)">
    <!-- Compact Pill Body -->
    <rect x="110" y="80" width="130" height="340" rx="65" fill="url(#tagWhite)" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Top Large Metal-Reinforced Ring Hole (Designed for clips/carabiners) -->
    <circle cx="175" cy="145" r="42" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="175" cy="145" r="36" fill="#020617"/>

    <!-- Center Push Button -->
    <circle cx="175" cy="290" r="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="175" cy="290" r="8" fill="#64748b"/>

    <!-- Samsung Wordmark -->
    <text x="175" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#475569" letter-spacing="1.5" text-anchor="middle">SAMSUNG</text>
  </g>
</svg>