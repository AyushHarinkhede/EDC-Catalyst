<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <filter id="jetBotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#jetBotShadow)">
    <circle cx="250" cy="210" r="145" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="250" cy="210" r="130" fill="#ffffff"/>

    <!-- Front Stereo 3D Camera Sensor for Object Recognition -->
    <rect x="180" y="75" width="140" height="32" rx="8" fill="#0f172a"/>
    <circle cx="215" cy="91" r="7" fill="#38bdf8"/>
    <circle cx="285" cy="91" r="7" fill="#38bdf8"/>

    <!-- Center Retractable LiDAR Sensor Turret -->
    <circle cx="250" cy="190" r="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="250" cy="190" r="24" fill="#0f172a"/>
    <circle cx="250" cy="190" r="8" fill="#ef4444"/>

    <!-- Jet Bot AI+ Inscription -->
    <text x="250" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#334155" letter-spacing="1" text-anchor="middle">Jet Bot AI+</text>
  </g>
</svg>