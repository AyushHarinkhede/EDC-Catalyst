<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <filter id="cctvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#cctvShadow)">
    <!-- Magnetic Circular Base -->
    <ellipse cx="200" cy="380" rx="75" ry="18" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <rect x="194" y="260" width="12" height="120" rx="6" fill="#94a3b8"/>

    <!-- Ball Swivel Joint -->
    <circle cx="200" cy="255" r="16" fill="#475569"/>

    <!-- Camera Eyeball Housing -->
    <circle cx="200" cy="170" r="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="200" cy="170" r="72" fill="#0f172a"/>

    <!-- Wide-Angle 145° Glass Lens -->
    <circle cx="200" cy="165" r="38" fill="#020617" stroke="#334155" stroke-width="2"/>
    <circle cx="200" cy="165" r="22" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="200" cy="165" r="10" fill="#38bdf8" opacity="0.8"/>

    <!-- Infrared Night Vision LED Ring -->
    <circle cx="200" cy="120" r="4" fill="#ef4444"/>
    <circle cx="200" cy="215" r="3" fill="#22c55e"/> <!-- Activity LED -->
  </g>
</svg>