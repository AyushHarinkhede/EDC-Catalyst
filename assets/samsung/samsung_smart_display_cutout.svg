<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <filter id="m8Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
    <linearGradient id="m8White" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>
  <g filter="url(#m8Shadow)">
    <!-- Flat Minimalist Pedestal Base -->
    <rect x="210" y="440" width="180" height="14" rx="4" fill="url(#m8White)" stroke="#e7e5e4" stroke-width="1.5"/>
    <!-- Slender Flat Vertical Stand Neck -->
    <rect x="290" y="240" width="20" height="205" rx="4" fill="url(#m8White)" stroke="#e7e5e4" stroke-width="1.2"/>

    <!-- Ultra-Slim Monitor Frame (Warm White / Sunset) -->
    <rect x="80" y="100" width="440" height="260" rx="10" fill="url(#m8White)" stroke="#e7e5e4" stroke-width="2"/>
    <!-- 4K HDR Smart Hub Screen -->
    <rect x="86" y="106" width="428" height="248" rx="6" fill="#0c0a09"/>
    
    <!-- Smart Hub UI Tiles -->
    <g transform="translate(105, 130)">
      <rect x="0" y="0" width="75" height="100" rx="8" fill="#e11d48"/>
      <rect x="85" y="0" width="75" height="100" rx="8" fill="#2563eb"/>
      <rect x="170" y="0" width="75" height="100" rx="8" fill="#16a34a"/>
      <rect x="255" y="0" width="75" height="100" rx="8" fill="#9333ea"/>
    </g>

    <!-- Magnetic SlimFit Camera Attached to Top Center -->
    <rect x="270" y="82" width="60" height="18" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="1.2"/>
    <circle cx="300" cy="91" r="5" fill="#38bdf8"/>
  </g>
</svg>