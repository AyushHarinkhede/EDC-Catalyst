<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="sCubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#sCubeShadow)">
    <!-- Modular Cube Enclosure in Bespoke Warm White / Beige -->
    <rect x="100" y="80" width="300" height="310" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Front Herringbone / Stripe Dispersion Grille (WindFree Pure Air) -->
    <rect x="120" y="100" width="260" height="270" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.65">
      <line x1="140" y1="130" x2="360" y2="130"/>
      <line x1="140" y1="160" x2="360" y2="160"/>
      <line x1="140" y1="190" x2="360" y2="190"/>
      <line x1="140" y1="220" x2="360" y2="220"/>
      <line x1="140" y1="250" x2="360" y2="250"/>
      <line x1="140" y1="280" x2="360" y2="280"/>
      <line x1="140" y1="310" x2="360" y2="310"/>
      <line x1="140" y1="340" x2="360" y2="340"/>
    </g>

    <!-- Top Right Micro Air Quality Color Indicator -->
    <circle cx="345" cy="120" r="8" fill="#22c55e" filter="drop-shadow(0 0 4px #4ade80)"/>
    <text x="250" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#475569" letter-spacing="2" text-anchor="middle">BESPOKE CUBE</text>
  </g>
</svg>