<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <filter id="sWasherShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#sWasherShadow)">
    <!-- Bespoke Minimalist Flat Front Chassis in Clean Silver/Black -->
    <rect x="100" y="60" width="300" height="420" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- AI Control Console Strip (Integrated Flat Panel) -->
    <rect x="110" y="75" width="280" height="60" rx="6" fill="#020617"/>
    <text x="145" y="110" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#38bdf8">AI OptiWash</text>
    <circle cx="250" cy="105" r="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="250" cy="105" r="8" fill="#38bdf8"/>
    <text x="350" y="112" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#22c55e" text-anchor="middle">0:42</text>

    <!-- Flat Tinted Round Glass Door with Flush Hinge -->
    <circle cx="250" cy="290" r="120" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="250" cy="290" r="105" fill="#0f172a"/>
    <circle cx="250" cy="290" r="75" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <ellipse cx="250" cy="290" rx="45" ry="45" fill="#38bdf8" opacity="0.25"/>
  </g>
</svg>