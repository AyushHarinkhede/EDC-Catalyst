<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <filter id="freestyleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#freestyleShadow)">
    <!-- 180° Swivel Cradle Stand Base -->
    <ellipse cx="225" cy="380" rx="85" ry="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- U-Shaped Metal Stand Arm -->
    <path d="M 140,375 C 140,320 140,240 140,225" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <path d="M 310,375 C 310,320 310,240 310,225" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

    <!-- Cylindrical Projector Body (Tilted Upwards 35 Degrees) -->
    <g transform="translate(225, 225) rotate(-35)">
      <rect x="-55" y="-110" width="110" height="220" rx="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
      
      <!-- 360-Degree Omnidirectional Speaker Grille Holes (Middle) -->
      <g fill="#94a3b8" opacity="0.5">
        <circle cx="-35" cy="30" r="2"/><circle cx="-15" cy="30" r="2"/><circle cx="5" cy="30" r="2"/><circle cx="25" cy="30" r="2"/>
        <circle cx="-35" cy="50" r="2"/><circle cx="-15" cy="50" r="2"/><circle cx="5" cy="50" r="2"/><circle cx="25" cy="50" r="2"/>
        <circle cx="-35" cy="70" r="2"/><circle cx="-15" cy="70" r="2"/><circle cx="5" cy="70" r="2"/><circle cx="25" cy="70" r="2"/>
      </g>

      <!-- Front Optical Lens & Auto-Keystone Sensors -->
      <circle cx="0" cy="-70" r="32" fill="#020617" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="-70" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="-70" r="8" fill="#38bdf8" opacity="0.8"/>
      <!-- Distance / Keystone Sensor -->
      <circle cx="25" cy="-70" r="4" fill="#ef4444"/>
    </g>
  </g>
</svg>