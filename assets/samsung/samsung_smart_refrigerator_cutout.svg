<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <filter id="sFridgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#sFridgeShadow)">
    <!-- Bespoke Flat Glass Panel Cabinet (Clean Charcoal / Navy Panels) -->
    <rect x="110" y="60" width="280" height="520" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Upper Left Door (Matte Glam Navy) -->
    <rect x="115" y="65" width="130" height="240" rx="8" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>

    <!-- Upper Right Door: Large Family Hub Touchscreen Display (Vertical 21.5") -->
    <rect x="255" y="65" width="130" height="240" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect x="265" y="80" width="110" height="205" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Family Hub Display UI (Widgets, Recipes, Notes, SmartThings) -->
    <text x="320" y="115" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Family Hub</text>
    <rect x="275" y="130" width="90" height="40" rx="6" fill="#1e293b"/>
    <text x="320" y="152" font-family="'DM Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Inside: 3°C</text>
    <rect x="275" y="180" width="42" height="42" rx="4" fill="#2563eb"/>
    <rect x="323" y="180" width="42" height="42" rx="4" fill="#e11d48"/>

    <!-- Lower French Doors (Customizable Bespoke Clean White Panels) -->
    <rect x="115" y="315" width="130" height="255" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="255" y="315" width="130" height="255" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Recessed Recessed Pocket Handles -->
    <rect x="130" y="306" width="100" height="6" rx="2" fill="#020617"/>
    <rect x="270" y="306" width="100" height="6" rx="2" fill="#020617"/>
  </g>
</svg>