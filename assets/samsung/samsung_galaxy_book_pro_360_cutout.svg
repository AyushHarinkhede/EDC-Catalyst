<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="mysticNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <g filter="url(#bookShadow)">
    <!-- Keyboard Deck (Base) -->
    <polygon points="60,370 590,370 540,240 110,240" fill="url(#mysticNavy)" stroke="#334155" stroke-width="2"/>
    <!-- Glass Touchpad -->
    <rect x="270" y="310" width="110" height="50" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Backlit Keyboard Well -->
    <polygon points="120,295 530,295 510,245 140,245" fill="#020617"/>

    <!-- 360-degree Hinge -->
    <rect x="140" y="235" width="370" height="8" rx="2" fill="#475569"/>

    <!-- Upper Super AMOLED Touchscreen Display (Angled Upwards) -->
    <polygon points="140,235 510,235 520,70 130,70" fill="#020617" stroke="#475569" stroke-width="2"/>
    <!-- Vibrant Windows 11 Wallpaper Bloom -->
    <polygon points="148,228 502,228 512,78 138,78" fill="#0f172a"/>
    <ellipse cx="325" cy="150" rx="110" ry="50" fill="#38bdf8" opacity="0.6"/>
    <ellipse cx="345" cy="140" rx="80" ry="40" fill="#818cf8" opacity="0.7"/>

    <!-- S-Pen Resting Alongside -->
    <rect x="550" y="160" width="8" height="180" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  </g>
</svg>