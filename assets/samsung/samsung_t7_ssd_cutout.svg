<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <filter id="t7Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="indigoT7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <g filter="url(#t7Shadow)">
    <!-- Aluminum Pocket Enclosure with Rounded Edges -->
    <rect x="90" y="85" width="320" height="180" rx="18" fill="url(#indigoT7)" stroke="#2563eb" stroke-width="2"/>

    <!-- Left USB-C Port & LED Motion Square -->
    <rect x="78" y="155" width="14" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="85" cy="175" rx="3" ry="12" fill="#020617"/>

    <!-- LED Motion Status Square (Soft Blue Glow) -->
    <rect x="125" y="160" width="28" height="28" rx="6" fill="#020617" stroke="#60a5fa" stroke-width="2"/>
    <rect x="133" y="168" width="12" height="12" rx="2" fill="#38bdf8"/>

    <!-- Official Inscriptions -->
    <text x="320" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">SAMSUNG</text>
    <text x="320" y="205" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.5">Portable SSD T7 · 2TB</text>
  </g>
</svg>