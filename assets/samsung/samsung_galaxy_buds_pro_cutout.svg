<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="budsProShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="phantomViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <g filter="url(#budsProShadow)">
    <!-- Square Rounded Clamshell Case -->
    <rect x="135" y="110" width="230" height="190" rx="36" fill="url(#phantomViolet)" stroke="#6b21a8" stroke-width="2"/>
    <rect x="145" y="120" width="210" height="170" rx="28" fill="#2e1065"/>

    <!-- High-Gloss Metallic Ergonomic Earbuds -->
    <ellipse cx="200" cy="205" rx="38" ry="32" fill="url(#phantomViolet)" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="195" cy="195" rx="24" ry="16" fill="#ffffff" opacity="0.35"/>
    <circle cx="220" cy="210" r="4" fill="#020617"/> <!-- Mesh mic vent -->

    <ellipse cx="300" cy="205" rx="38" ry="32" fill="url(#phantomViolet)" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="295" cy="195" rx="24" ry="16" fill="#ffffff" opacity="0.35"/>
    <circle cx="280" cy="210" r="4" fill="#020617"/>

    <!-- LED Charge Indicator -->
    <circle cx="250" cy="250" r="3.5" fill="#22c55e"/>
  </g>
</svg>