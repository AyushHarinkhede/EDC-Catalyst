<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="book4Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="moonstoneGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <g filter="url(#book4Shadow)">
    <!-- Base Lower Deck -->
    <polygon points="60,370 590,370 540,240 110,240" fill="url(#moonstoneGray)" stroke="#475569" stroke-width="2"/>
    <!-- Huge Centered Glass Touchpad -->
    <rect x="255" y="305" width="140" height="55" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Keyboard Keys -->
    <polygon points="115,295 535,295 510,245 140,245" fill="#1e293b"/>

    <!-- Upright Display Lid in Slim Bezel -->
    <polygon points="140,235 510,235 520,65 130,65" fill="#020617" stroke="#94a3b8" stroke-width="2"/>
    <!-- Dynamic AMOLED 2X Display -->
    <polygon points="146,229 504,229 514,71 136,71" fill="#050814"/>
    <circle cx="325" cy="140" r="60" fill="#a855f7" opacity="0.6"/>
    <circle cx="360" cy="150" r="50" fill="#ec4899" opacity="0.6"/>

    <!-- S-Pen Stylus -->
    <rect x="555" y="150" width="9" height="190" rx="3.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
  </g>
</svg>