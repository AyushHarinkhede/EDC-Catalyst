<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="tagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#tagShadow)" transform="translate(200, 200) rotate(45)">
    <!-- Rounded Diamond / Square Body -->
    <rect x="-85" y="-85" width="170" height="170" rx="38" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Top-Corner Keyhole Lanyard Ring -->
    <circle cx="-50" cy="-50" r="16" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="-50" cy="-50" r="12" fill="#020617"/>

    <!-- Center SmartThings Button -->
    <circle cx="10" cy="10" r="32" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="10" cy="10" r="8" fill="#38bdf8"/>
  </g>
</svg>