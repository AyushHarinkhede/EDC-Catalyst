<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="100%">
  <defs>
    <filter id="sAcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#sAcShadow)">
    <rect x="60" y="70" width="530" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 23,000 Micro Air Holes (WindFree Cooling Without Direct Draft) -->
    <g fill="#94a3b8" opacity="0.5">
      <circle cx="100" cy="120" r="1.5"/><circle cx="130" cy="120" r="1.5"/><circle cx="160" cy="120" r="1.5"/><circle cx="190" cy="120" r="1.5"/><circle cx="220" cy="120" r="1.5"/>
      <circle cx="100" cy="140" r="1.5"/><circle cx="130" cy="140" r="1.5"/><circle cx="160" cy="140" r="1.5"/><circle cx="190" cy="140" r="1.5"/><circle cx="220" cy="140" r="1.5"/>
      <circle cx="100" cy="160" r="1.5"/><circle cx="130" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="190" cy="160" r="1.5"/><circle cx="220" cy="160" r="1.5"/>
      <circle cx="100" cy="180" r="1.5"/><circle cx="130" cy="180" r="1.5"/><circle cx="160" cy="180" r="1.5"/><circle cx="190" cy="180" r="1.5"/><circle cx="220" cy="180" r="1.5"/>
    </g>

    <!-- Hidden Soft Blue Digital Temperature Display -->
    <text x="490" y="145" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#0284c7">19°</text>
    
    <!-- WindFree Inscription -->
    <text x="100" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#334155">WindFree™</text>
  </g>
</svg>