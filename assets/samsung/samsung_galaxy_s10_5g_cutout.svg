<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <filter id="s10Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="prismSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0e7ff"/>
      <stop offset="70%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <g filter="url(#s10Shadow)">
    <!-- Chassis -->
    <rect x="80" y="50" width="240" height="520" rx="36" fill="url(#prismSilver)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Curved Glass Screen Border -->
    <rect x="85" y="55" width="230" height="510" rx="32" fill="#020617"/>
    <!-- Quad Pill Dual Punch-Hole Camera (Top Right) -->
    <rect x="235" y="70" width="55" height="18" rx="9" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="250" cy="79" r="5" fill="#1e1b4b"/>
    <circle cx="272" cy="79" r="4" fill="#38bdf8"/>
    <!-- Horizontal Rear Camera Module (Shown in subtle perspective) -->
    <rect x="130" y="85" width="140" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" opacity="0.15"/>
  </g>
</svg>