<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="100%" height="100%">
  <defs>
    <filter id="s23Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="botanicGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#0f3d21"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <g filter="url(#s23Shadow)">
    <!-- Sharp-Cornered Note Design Language -->
    <rect x="80" y="50" width="240" height="520" rx="14" fill="url(#botanicGreen)" stroke="#166534" stroke-width="2"/>

    <!-- Individual Floating Camera Lenses (No Camera Island) -->
    <!-- 200MP Main Camera -->
    <circle cx="130" cy="100" r="22" fill="#020617" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="130" cy="100" r="13" fill="#1e1b4b"/>
    <circle cx="130" cy="100" r="6" fill="#38bdf8"/>

    <!-- Ultra-Wide Camera -->
    <circle cx="130" cy="160" r="22" fill="#020617" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="130" cy="160" r="13" fill="#1e1b4b"/>

    <!-- 10x Periscope Zoom -->
    <circle cx="130" cy="220" r="22" fill="#020617" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="123" y="213" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.8"/>

    <!-- Right Column: Laser Sensor, Flash, 3x Telephoto -->
    <circle cx="185" cy="100" r="12" fill="#020617" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="185" cy="100" r="5" fill="#ef4444"/>
    <circle cx="185" cy="135" r="9" fill="#fef08a"/>
    <circle cx="185" cy="170" r="14" fill="#020617" stroke="#cbd5e1" stroke-width="1.8"/>

    <!-- Integrated S-Pen Stylus (Ejected at angle on side) -->
    <g transform="translate(340, 180) rotate(15)">
      <rect x="0" y="0" width="12" height="260" rx="4" fill="#020617" stroke="#166534" stroke-width="1.5"/>
      <polygon points="0,260 12,260 6,278" fill="#166534"/> <!-- Fine Tip -->
      <circle cx="6" cy="280" r="1.5" fill="#ffffff"/>
      <rect x="0" y="8" width="12" height="14" rx="2" fill="#166534"/> <!-- Clicker Button -->
    </g>
  </g>
</svg>