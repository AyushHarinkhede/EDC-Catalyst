<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="tagPlusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#tagPlusShadow)" transform="translate(200, 200) rotate(45)">
    <!-- Denim Blue UWB Tag -->
    <rect x="-85" y="-85" width="170" height="170" rx="38" fill="#1e3a8a" stroke="#2563eb" stroke-width="2.5"/>
    
    <!-- Metal-Lined Keyring Hole -->
    <circle cx="-50" cy="-50" r="16" fill="none" stroke="#93c5fd" stroke-width="4"/>
    <circle cx="-50" cy="-50" r="12" fill="#020617"/>

    <!-- UWB Center Action Button -->
    <circle cx="10" cy="10" r="32" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="10" y="15" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">+</text>
  </g>
</svg>