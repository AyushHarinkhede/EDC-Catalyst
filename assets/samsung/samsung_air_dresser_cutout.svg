    <text x="200" y="295" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">DE-WRINKLE</text>

    <text x="200" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="2" text-anchor="middle">AirDresser · JetAir</text>
