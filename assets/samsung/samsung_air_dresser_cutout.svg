<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="100%" height="100%">
  <defs>
    <filter id="airDresserShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
  </defs>
  <g filter="url(#airDresserShadow)">
    <rect x="110" y="40" width="180" height="600" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
