<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="titaniumBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <g filter="url(#ringShadow)">
    <!-- Outer Titanium Ring with Concave Curvature Profile -->
    <ellipse cx="225" cy="225" rx="145" ry="115" fill="none" stroke="url(#titaniumBlack)" stroke-width="36"/>
    
    <!-- Concave Center Dip Reflection Line -->
    <ellipse cx="225" cy="225" rx="145" ry="115" fill="none" stroke="#0f172a" stroke-width="12"/>

    <!-- Inner Ergonomic Resin Core with 3 PPG Sensor Nubs -->
    <ellipse cx="225" cy="225" rx="127" ry="97" fill="none" stroke="#020617" stroke-width="4"/>
    
    <!-- 3 Embedded Bio-Active Sensor Protrusions (Green/Red LED PPG Sensors) -->
    <circle cx="175" cy="210" r="5" fill="#22c55e" filter="drop-shadow(0 0 4px #4ade80)"/>
    <circle cx="225" cy="218" r="5" fill="#ef4444" filter="drop-shadow(0 0 4px #f87171)"/>
    <circle cx="275" cy="210" r="5" fill="#22c55e" filter="drop-shadow(0 0 4px #4ade80)"/>

    <!-- Subtle Orientation Alignment Notch -->
    <rect x="222" y="95" width="6" height="12" rx="2" fill="#cbd5e1"/>
  </g>
</svg>