<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <filter id="s21Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="phantomBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <g filter="url(#s21Shadow)">
    <!-- Chassis -->
    <rect x="80" y="50" width="240" height="520" rx="34" fill="url(#phantomBlack)" stroke="#334155" stroke-width="2"/>
    
    <!-- Iconic Seamless Contour-Cut Camera Housing (Top Left Corner) -->
    <path d="M 80,50 L 195,50 C 205,50 215,60 215,70 L 215,195 C 215,210 200,225 185,225 L 80,225 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- Large Triple Main Lenses -->
    <circle cx="120" cy="90" r="18" fill="#020617" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="90" r="10" fill="#1e1b4b"/>
    
    <circle cx="120" cy="138" r="18" fill="#020617" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="138" r="10" fill="#1e1b4b"/>

    <!-- 10x Periscope Telephoto Lens (Square Aperture) -->
    <circle cx="120" cy="185" r="18" fill="#020617" stroke="#475569" stroke-width="2"/>
    <rect x="113" y="178" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.7"/>

    <!-- Laser AF & Flash Array (Right Column) -->
    <circle cx="170" cy="95" r="10" fill="#020617"/>
    <circle cx="170" cy="95" r="5" fill="#ef4444"/> <!-- Laser AF red dot -->
    <circle cx="170" cy="138" r="8" fill="#fef08a"/> <!-- Flash -->
    <circle cx="170" cy="180" r="10" fill="#020617"/> <!-- 3x Telephoto -->
  </g>
</svg>