<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="qledArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#065f46"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <g filter="url(#neoShadow)">
    <!-- Slim Center Heavy Metal Pedestal Stand -->
    <ellipse cx="325" cy="415" rx="130" ry="12" fill="#0f172a" opacity="0.4"/>
    <rect x="245" y="395" width="160" height="15" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 290,395 L 305,355 L 345,355 L 360,395 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>

    <!-- 0.8mm Infinity Screen Bezel -->
    <rect x="50" y="45" width="550" height="320" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
    
    <!-- Quantum Mini LED High-Contrast Display -->
    <rect x="53" y="48" width="544" height="314" rx="2" fill="url(#qledArt)"/>
    <circle cx="240" cy="180" r="75" fill="#34d399" opacity="0.75" filter="blur(6px)"/>
    <circle cx="360" cy="160" r="95" fill="#0284c7" opacity="0.75" filter="blur(8px)"/>
    
    <!-- Attachable Slim One Connect Box on stand rear -->
    <rect x="290" y="365" width="70" height="25" rx="4" fill="#020617"/>
  </g>
</svg>