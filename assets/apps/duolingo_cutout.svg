<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="duoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2E05"/>
      <stop offset="50%" stop-color="#0F1F02"/>
      <stop offset="100%" stop-color="#050C01"/>
    </linearGradient>
    <linearGradient id="duoGreenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78E817"/>
      <stop offset="50%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#2B8200"/>
    </linearGradient>
    <linearGradient id="superDuolingoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1CB0F6"/>
      <stop offset="35%" stop-color="#58CC02"/>
      <stop offset="70%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#FF4B4B"/>
    </linearGradient>
    <filter id="duoCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#58CC02" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#duoCardShadow)">
    <!-- Base Card Slate -->
    <rect x="150" y="140" width="500" height="520" rx="56" fill="url(#duoGrad)" stroke="url(#superDuolingoGrad)" stroke-width="3.5"/>

    <!-- Popular Pill (सबसे लोकप्रिय) -->
    <g transform="translate(180, 165)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#0079C1"/>
      <text x="80" y="23" font-family="'Inter',-apple-system,sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">सबसे लोकप्रिय</text>
    </g>

    <!-- Duo Mascot Emblem Outer Ring -->
    <circle cx="400" cy="300" r="95" fill="rgba(88,204,2,0.12)" stroke="url(#duoGreenGlow)" stroke-width="4"/>

    <!-- Duo Owl SVG in Center -->
    <g transform="translate(335, 235) scale(1.3)">
      <!-- Head Body -->
      <path d="M50 10 C 26 10, 12 28, 12 56 C 12 76, 26 90, 50 90 C 74 90, 88 76, 88 56 C 88 28, 74 10, 50 10 Z" fill="#58CC02"/>
      <!-- Tufts -->
      <path d="M 28 14 C 20 8, 10 14, 14 26 C 18 20, 24 16, 28 14 Z" fill="#46A302"/>
      <path d="M 72 14 C 80 8, 90 14, 86 26 C 82 20, 76 16, 72 14 Z" fill="#46A302"/>
      <!-- Eyes -->
      <ellipse cx="34" cy="46" rx="13" ry="15" fill="#FFFFFF"/>
      <ellipse cx="36" cy="47" rx="7.5" ry="9" fill="#4B4B4B"/>
      <circle cx="38" cy="44" r="3" fill="#FFFFFF"/>

      <ellipse cx="66" cy="46" rx="13" ry="15" fill="#FFFFFF"/>
      <ellipse cx="64" cy="47" rx="7.5" ry="9" fill="#4B4B4B"/>
      <circle cx="62" cy="44" r="3" fill="#FFFFFF"/>
      <!-- Beak -->
      <path d="M 43 54 C 43 54, 50 67, 50 67 C 50 67, 57 54, 57 54 Z" fill="#FF9600" stroke="#E07A00" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <!-- Typography: Super Duolingo Personal -->
    <text x="400" y="440" font-family="'Inter',-apple-system,sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Super Duolingo</text>
    <text x="400" y="475" font-family="'Inter',-apple-system,sans-serif" font-size="18" font-weight="700" fill="#58CC02" text-anchor="middle" letter-spacing="1">पर्सनल प्लान (1 YEAR)</text>

    <!-- Price Pill Box -->
    <g transform="translate(200, 505)">
      <rect x="0" y="0" width="400" height="65" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(88,204,2,0.35)" stroke-width="1.5"/>
      <text x="20" y="41" font-family="'Inter',-apple-system,sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">₹1,749<tspan font-size="16" font-weight="600" fill="rgba(255,255,255,0.7)"> / साल</tspan></text>
      <text x="380" y="41" font-family="'Inter',-apple-system,sans-serif" font-size="20" font-weight="800" fill="#58CC02" text-anchor="end">₹146<tspan font-size="14" font-weight="600" fill="rgba(255,255,255,0.7)"> / महीना</tspan></text>
    </g>

    <!-- Features Bottom Row -->
    <text x="400" y="605" font-family="'Inter',-apple-system,sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">✓ अनलिमिटेड हार्ट्स  ·  ✓ कोई विज्ञापन नहीं  ·  ✓ 7 दिन मुफ्त ट्रायल</text>
  </g>
</svg>
