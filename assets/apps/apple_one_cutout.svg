<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="appleOneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="appleIntellGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="oneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#8B5CF6" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#oneGlow)">
    <!-- Base Curved Glass Slate -->
    <rect x="150" y="140" width="500" height="520" rx="56" fill="url(#appleOneGrad)" stroke="url(#appleIntellGlow)" stroke-width="3.5"/>
    
    <!-- Apple Intelligence Outer Halo -->
    <circle cx="400" cy="290" r="110" fill="none" stroke="url(#appleIntellGlow)" stroke-width="4.5" opacity="0.85"/>
    <circle cx="400" cy="290" r="92" fill="rgba(168,85,247,0.12)"/>

    <!-- Crisp White Apple Logo -->
    <path d="M417.8 296.8c-1.9 2.8-3.8 5.4-6.8 5.5-2.9.1-3.9-1.7-7.3-1.7-3.4 0-4.4 1.7-7.2 1.8-2.9.1-5.1-2.9-7-5.6-3.8-5.6-6.7-15.7-2.8-22.5 1.9-3.4 5.4-5.5 9.1-5.6 2.8 0 5.5 1.9 7.3 1.9 1.7 0 5-2.4 8.4-2 1.4.1 5.5.6 8.1 4.4-.2.1-4.8 2.8-4.7 8.4.1 6.7 5.8 8.9 5.9 8.9-.1.2-.9 3.2-3 6.3m-12.7-35.4c1.6-2 2.7-4.7 2.3-7.5-2.4.1-5.1 1.6-6.8 3.5-1.5 1.8-2.8 4.6-2.4 7.3 2.6.2 5.3-1.4 6.9-3.3z" fill="#FFFFFF"/>

    <!-- Text: Apple One -->
    <text x="400" y="445" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Apple One</text>
    <text x="400" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif" font-size="20" font-weight="600" fill="#A855F7" text-anchor="middle" letter-spacing="1.2">FAMILY &amp; APPLE INTELLIGENCE</text>

    <!-- Services Badges Row -->
    <g transform="translate(190, 520)">
      <!-- Music -->
      <rect x="0" y="0" width="90" height="42" rx="12" fill="rgba(250,45,72,0.18)" stroke="rgba(250,45,72,0.5)" stroke-width="1.5"/>
      <text x="45" y="27" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#FA2D48" text-anchor="middle">Music</text>
      <!-- TV+ -->
      <rect x="105" y="0" width="90" height="42" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <text x="150" y="27" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">TV+</text>
      <!-- Arcade -->
      <rect x="210" y="0" width="90" height="42" rx="12" fill="rgba(235,94,40,0.18)" stroke="rgba(235,94,40,0.5)" stroke-width="1.5"/>
      <text x="255" y="27" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#F97316" text-anchor="middle">Arcade</text>
      <!-- iCloud 200GB -->
      <rect x="315" y="0" width="105" height="42" rx="12" fill="rgba(56,189,248,0.18)" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
      <text x="367" y="27" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">200GB Cloud</text>
    </g>

    <!-- Footer Tagline -->
    <text x="400" y="610" font-family="-apple-system,sans-serif" font-size="17" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">₹365/mo · ₹4,380/yr · Up to 6 Family Members</text>
  </g>
</svg>
