<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="flipperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="flipperWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="flipperOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#ff8200"/>
      <stop offset="100%" stop-color="#e66e00"/>
    </linearGradient>
    <linearGradient id="screenBacklight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="50%" stop-color="#ff8500"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="irLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="50%" stop-color="#180b26"/>
      <stop offset="100%" stop-color="#0b0314"/>
    </linearGradient>
    <linearGradient id="dpadShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa33"/>
      <stop offset="70%" stop-color="#ff8200"/>
      <stop offset="100%" stop-color="#d96b00"/>
    </linearGradient>
  </defs>

  <g filter="url(#flipperShadow)">
    <!-- Main Handheld Body: Ergonomic Rounded Chassis (Pure Matte White) -->
    <rect x="70" y="55" width="460" height="250" rx="36" fill="url(#flipperWhite)" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Lanyard / Keyring Loop Hole (Top Right) -->
    <path d="M485,55 C505,55 520,70 520,90 L520,105 C520,120 505,130 485,130 Z" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="500" cy="85" rx="8" ry="14" fill="#0f172a" opacity="0.15"/>
    <ellipse cx="500" cy="85" rx="6" ry="11" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Top 18-Pin GPIO Header Ports -->
    <rect x="130" y="50" width="220" height="12" rx="4" fill="#334155"/>
    <!-- 18 Individual Female Header Pin Sockets -->
    <g fill="#0f172a">
      <rect x="136" y="53" width="7" height="6" rx="1"/>
      <rect x="148" y="53" width="7" height="6" rx="1"/>
      <rect x="160" y="53" width="7" height="6" rx="1"/>
      <rect x="172" y="53" width="7" height="6" rx="1"/>
      <rect x="184" y="53" width="7" height="6" rx="1"/>
      <rect x="196" y="53" width="7" height="6" rx="1"/>
      <rect x="208" y="53" width="7" height="6" rx="1"/>
      <rect x="220" y="53" width="7" height="6" rx="1"/>
      <rect x="232" y="53" width="7" height="6" rx="1"/>
      <rect x="244" y="53" width="7" height="6" rx="1"/>
      <rect x="256" y="53" width="7" height="6" rx="1"/>
      <rect x="268" y="53" width="7" height="6" rx="1"/>
      <rect x="280" y="53" width="7" height="6" rx="1"/>
      <rect x="292" y="53" width="7" height="6" rx="1"/>
      <rect x="304" y="53" width="7" height="6" rx="1"/>
      <rect x="316" y="53" width="7" height="6" rx="1"/>
      <rect x="328" y="53" width="7" height="6" rx="1"/>
      <rect x="340" y="53" width="7" height="6" rx="1"/>
    </g>

    <!-- Bottom iButton 1-Wire Contact Probe Pad -->
    <path d="M120,305 C120,290 145,290 145,305 Z" fill="#94a3b8"/>
    <ellipse cx="132" cy="298" rx="8" ry="4" fill="#64748b"/>
    <circle cx="132" cy="298" r="2.5" fill="#f8fafc"/>

    <!-- Left Side: USB-C & MicroSD Indications -->
    <rect x="66" y="150" width="5" height="24" rx="2" fill="#64748b"/>
    <rect x="66" y="200" width="5" height="32" rx="2" fill="#94a3b8"/>

    <!-- Infrared Transceiver Window (Glossy Dark Purple/Black Lens on Front Top Left) -->
    <rect x="74" y="70" width="28" height="42" rx="8" fill="url(#irLens)" stroke="#381559" stroke-width="1.5"/>
    <circle cx="88" cy="91" r="5" fill="#581c87" opacity="0.6"/>

    <!-- Screen Bezel Surround (Classic Flipper Orange Border) -->
    <rect x="110" y="85" width="220" height="180" rx="18" fill="url(#flipperOrange)" stroke="#cc6600" stroke-width="2"/>

    <!-- Inner Screen Display Window (1.4-inch 128x64 Orange Monochrome Backlit LCD) -->
    <rect x="122" y="97" width="196" height="156" rx="10" fill="url(#screenBacklight)" stroke="#b35900" stroke-width="1.5"/>

    <!-- LCD Pixel Graphics: The Famous Cyber-Dolphin "Flipper" Avatar -->
    <!-- Top Status Bar -->
    <g fill="#1a1100">
      <rect x="130" y="105" width="40" height="11" rx="2"/>
      <text x="150" y="114" font-family="'Courier New', monospace" font-size="8" font-weight="900" fill="#ff9800" text-anchor="middle">LVL 3</text>
      
      <text x="215" y="114" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#1a1100" text-anchor="middle">HAPPY</text>

      <!-- Battery Icon -->
      <rect x="290" y="106" width="18" height="9" rx="1.5" fill="none" stroke="#1a1100" stroke-width="1.2"/>
      <rect x="292" y="108" width="11" height="5" fill="#1a1100"/>
      <rect x="308" y="108" width="2" height="5" rx="0.5" fill="#1a1100"/>
    </g>

    <!-- Flipper the Dolphin Pixel Mascot (Center Stage on Screen) -->
    <g transform="translate(155, 126)" fill="#1a1100">
      <!-- Dolphin Body -->
      <path d="M 30,35 C 15,35 5,45 5,55 C 5,72 25,80 50,80 C 75,80 90,68 95,50 C 95,35 75,25 50,25 C 42,25 35,28 30,35 Z"/>
      <!-- Dolphin Snout / Beak -->
      <path d="M 5,52 C -5,54 -8,58 -2,62 C 3,64 8,63 12,60 Z"/>
      <!-- Dorsal Fin -->
      <path d="M 45,26 C 48,15 56,12 60,18 C 62,22 58,26 55,27 Z"/>
      <!-- Tail / Fluke -->
      <path d="M 92,54 C 105,48 115,44 118,50 C 114,56 106,58 98,62 C 108,66 115,70 114,76 C 108,78 98,72 90,65 Z"/>
      <!-- Flipper Pectoral Fin -->
      <path d="M 38,62 C 32,74 25,78 22,75 C 22,70 28,64 34,60 Z"/>
      
      <!-- Big Cute Pixel Eye -->
      <ellipse cx="26" cy="46" rx="6" ry="7" fill="#ff9800"/>
      <ellipse cx="27" cy="46" rx="4" ry="5" fill="#1a1100"/>
      <circle cx="28" cy="44" r="1.5" fill="#ff9800"/>

      <!-- Dolphin Smile -->
      <path d="M 8,58 Q 18,66 28,58" fill="none" stroke="#ff9800" stroke-width="2" stroke-linecap="round"/>

      <!-- Mood Dialogue Cloud: "Ready to Hack!" -->
      <rect x="25" y="85" width="80" height="15" rx="4" fill="#1a1100"/>
      <text x="65" y="96" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#ff9800" text-anchor="middle">Sub-GHz: 433M</text>
    </g>

    <!-- Right Controls Section: 5-Way Directional D-Pad & Back Button -->
    <!-- D-Pad Base Circle (High-Contrast Recessed Well) -->
    <circle cx="430" cy="180" r="54" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Directional Cross Ring (Orange D-Pad) -->
    <circle cx="430" cy="180" r="48" fill="url(#flipperOrange)" stroke="#cc6600" stroke-width="1.5"/>

    <!-- Directional Triangular Arrows -->
    <!-- UP -->
    <polygon points="430,138 423,148 437,148" fill="#ffffff"/>
    <!-- DOWN -->
    <polygon points="430,222 423,212 437,212" fill="#ffffff"/>
    <!-- LEFT -->
    <polygon points="388,180 398,173 398,187" fill="#ffffff"/>
    <!-- RIGHT -->
    <polygon points="472,180 462,173 462,187" fill="#ffffff"/>

    <!-- Center OK Button -->
    <circle cx="430" cy="180" r="22" fill="url(#flipperWhite)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="430" cy="180" r="18" fill="url(#dpadShine)"/>
    <circle cx="430" cy="180" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="430" cy="180" r="10" fill="url(#dpadShine)"/>

    <!-- Circular Back / Return Button (Bottom Left of D-Pad) -->
    <circle cx="365" cy="245" r="17" fill="url(#flipperWhite)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="365" cy="245" r="13" fill="#f1f5f9"/>
    <!-- Left Return Arrow Icon -->
    <path d="M368,240 L361,245 L368,250 M362,245 L371,245" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Official Brand Inscriptions & Logos -->
    <g transform="translate(112, 276)">
      <!-- Official Flipper Wordmark in bold technical sans -->
      <text x="0" y="16" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#334155" letter-spacing="2">FLIPPER</text>
      <!-- "ZERO" in Orange Accent badge -->
      <rect x="94" y="2" width="56" height="18" rx="4" fill="url(#flipperOrange)"/>
      <text x="122" y="16" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ZERO</text>
    </g>

    <!-- Sub-text specs on front casing -->
    <text x="430" y="278" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1">RFID · NFC · Sub-GHz</text>
  </g>
</svg>