<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="airstraitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="prussianBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="richCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <g filter="url(#airstraitShadow)">
    <!-- Dual Tongs / Arms of Straightener (Slightly Ajar Open Angle) -->
    <!-- Top Arm (Hinged at Right) -->
    <path d="M 120,150 L 440,190 C 470,195 490,205 490,225 L 430,225 L 120,185 C 105,185 95,175 95,165 C 95,155 105,150 120,150 Z" fill="url(#prussianBlue)" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Top High-Velocity Airflow Diffuser Blade (45-degree angle blade) -->
    <rect x="135" y="172" width="160" height="10" rx="3" fill="url(#richCopper)" stroke="#c2410c" stroke-width="1.2"/>
    <line x1="145" y1="177" x2="285" y2="177" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Bottom Arm -->
    <path d="M 120,285 L 440,245 C 470,240 490,230 490,210 L 430,210 L 120,250 C 105,250 95,260 95,270 C 95,280 105,285 120,285 Z" fill="url(#prussianBlue)" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Bottom High-Velocity Airflow Diffuser Blade -->
    <rect x="135" y="253" width="160" height="10" rx="3" fill="url(#richCopper)" stroke="#c2410c" stroke-width="1.2"/>
    <line x1="145" y1="258" x2="285" y2="258" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- High-Definition Color LCD Display on Top Arm (Wet/Dry Mode & Heat Setting) -->
    <rect x="330" y="180" width="55" height="24" rx="5" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="357" y="196" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle">WET 110°C</text>

    <!-- Hinge Mechanism & Power Cord Swivel (Right) -->
    <circle cx="475" cy="217" r="18" fill="url(#richCopper)" stroke="#9a3412" stroke-width="2"/>
    <circle cx="475" cy="217" r="8" fill="#0f172a"/>
  </g>
</svg>