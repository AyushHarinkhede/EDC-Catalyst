<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <filter id="outsizeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="outsizeNickel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <g filter="url(#outsizeShadow)">
    <!-- Right Motor / Battery Pack -->
    <path d="M 450,170 L 485,115 C 505,115 540,135 540,170 L 530,270 C 530,305 495,325 470,325 L 425,325 C 415,325 415,290 435,270 L 450,225 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="505" cy="145" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>

    <!-- Rear Filter Cone -->
    <path d="M 525,135 L 600,120 C 615,120 625,135 625,160 L 625,200 C 625,225 615,240 600,240 L 525,225 Z" fill="#9333ea" stroke="#581c87" stroke-width="2"/>
    <circle cx="615" cy="180" r="22" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="615" y="184" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle">85m</text>

    <!-- 150% Larger Capacity Bin (1.9 Liters) -->
    <rect x="230" y="130" width="145" height="95" rx="14" fill="#f8fafc" opacity="0.3" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="365" y="135" width="16" height="85" rx="3" fill="#ef4444"/>

    <!-- High Torque Digital Motorbar XL Head & Wand -->
    <path d="M 230,175 L 110,175" stroke="#ea580c" stroke-width="22" stroke-linecap="round"/>
    
    <!-- XL De-Tangling Motorbar Head -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="85" height="90" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
      <ellipse cx="25" cy="45" rx="18" ry="32" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <rect x="30" y="15" width="48" height="60" rx="4" fill="#020617"/>
      <!-- Polycarbonate Vanes -->
      <line x1="36" y1="20" x2="36" y2="70" stroke="#ef4444" stroke-width="4"/>
      <line x1="50" y1="20" x2="50" y2="70" stroke="#38bdf8" stroke-width="4"/>
      <line x1="64" y1="20" x2="64" y2="70" stroke="#ef4444" stroke-width="4"/>
    </g>
  </g>
</svg>