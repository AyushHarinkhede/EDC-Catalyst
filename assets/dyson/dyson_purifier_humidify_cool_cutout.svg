<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <filter id="ph04Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="nickelWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="ph04Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <g filter="url(#ph04Shadow)">
    <!-- Base Water Tank & Filtration Unit -->
    <rect x="180" y="380" width="140" height="260" rx="22" fill="url(#ph04Gold)" stroke="#b45309" stroke-width="2"/>
    <!-- Clear Blue Water Reservoir Tank with Water Level -->
    <rect x="195" y="470" width="110" height="150" rx="10" fill="#38bdf8" opacity="0.35" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 200,560 C 220,555 240,565 260,560 C 280,555 300,565 305,560 L 305,615 L 195,615 Z" fill="#0284c7" opacity="0.5"/>
    
    <!-- LCD Screen -->
    <circle cx="250" cy="425" r="16" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="429" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle">50%</text>

    <!-- Upper Bladeless Loop Amplifier with Jet Control Oscillators -->
    <path d="M 205,100 C 205,70 295,70 295,100 L 295,380 L 205,380 Z" fill="none" stroke="url(#nickelWhite)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 219,105 C 219,85 281,85 281,105 L 281,375 L 219,375 Z" fill="#ffffff" opacity="0.15"/>
    
    <!-- Center Air Jet Aperture -->
    <rect x="238" y="90" width="24" height="280" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Jet Control Airflow Flaps -->
    <line x1="220" y1="120" x2="220" y2="360" stroke="#0284c7" stroke-width="2.5" opacity="0.7"/>
    <line x1="280" y1="120" x2="280" y2="360" stroke="#0284c7" stroke-width="2.5" opacity="0.7"/>
  </g>
</svg>