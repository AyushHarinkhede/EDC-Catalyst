<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <filter id="bigQuietShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="dysonSatinBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dysonGoldCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <g filter="url(#bigQuietShadow)">
    <!-- Base Roller Casters -->
    <ellipse cx="250" cy="590" rx="100" ry="18" fill="#0f172a" opacity="0.8"/>
    
    <!-- Lower Filtration Cylinder (Acoustically Engineered Perforated Grille) -->
    <rect x="155" y="270" width="190" height="310" rx="28" fill="url(#dysonSatinBlue)" stroke="#1e40af" stroke-width="2"/>
    <!-- 360 Micro-Perforation Mesh Holes -->
    <g fill="#38bdf8" opacity="0.4">
      <circle cx="180" cy="300" r="2"/><circle cx="205" cy="300" r="2"/><circle cx="230" cy="300" r="2"/><circle cx="255" cy="300" r="2"/><circle cx="280" cy="300" r="2"/><circle cx="305" cy="300" r="2"/>
      <circle cx="180" cy="330" r="2"/><circle cx="205" cy="330" r="2"/><circle cx="230" cy="330" r="2"/><circle cx="255" cy="330" r="2"/><circle cx="280" cy="330" r="2"/><circle cx="305" cy="330" r="2"/>
      <circle cx="180" cy="360" r="2"/><circle cx="205" cy="360" r="2"/><circle cx="230" cy="360" r="2"/><circle cx="255" cy="360" r="2"/><circle cx="280" cy="360" r="2"/><circle cx="305" cy="360" r="2"/>
      <circle cx="180" cy="390" r="2"/><circle cx="205" cy="390" r="2"/><circle cx="230" cy="390" r="2"/><circle cx="255" cy="390" r="2"/><circle cx="280" cy="390" r="2"/><circle cx="305" cy="390" r="2"/>
      <circle cx="180" cy="420" r="2"/><circle cx="205" cy="420" r="2"/><circle cx="230" cy="420" r="2"/><circle cx="255" cy="420" r="2"/><circle cx="280" cy="420" r="2"/><circle cx="305" cy="420" r="2"/>
      <circle cx="180" cy="450" r="2"/><circle cx="205" cy="450" r="2"/><circle cx="230" cy="450" r="2"/><circle cx="255" cy="450" r="2"/><circle cx="280" cy="450" r="2"/><circle cx="305" cy="450" r="2"/>
    </g>

    <!-- Center LCD Display (Air Quality AQI Index) -->
    <circle cx="250" cy="285" r="16" fill="#020617" stroke="#22c55e" stroke-width="2"/>
    <text x="250" y="289" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" fill="#22c55e" text-anchor="middle">AQI 1</text>

    <!-- Upper Cone Aerodynamic Nozzle (Cone Aerodynamics projects air over 32 feet) -->
    <path d="M 175,270 L 130,120 C 130,100 370,100 370,120 L 325,270 Z" fill="url(#dysonGoldCone)" stroke="#b45309" stroke-width="2"/>
    <!-- Top Projection Air Nozzle Opening -->
    <ellipse cx="250" cy="118" rx="115" ry="24" fill="#020617" stroke="#ca8a04" stroke-width="2.5"/>
    <!-- Inner Air Jet Blade -->
    <ellipse cx="250" cy="118" rx="80" ry="14" fill="#1e293b"/>
    <ellipse cx="250" cy="118" rx="50" ry="8" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>