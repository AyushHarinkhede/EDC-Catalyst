<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="airwrapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="awNickel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="awCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <g filter="url(#airwrapShadow)">
    <!-- Main Wand Cylindrical Handle -->
    <rect x="280" y="190" width="220" height="52" rx="14" fill="url(#awNickel)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Base Removable Filter Cage with Air Holes -->
    <rect x="470" y="185" width="45" height="62" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <g fill="#64748b" opacity="0.6">
      <circle cx="485" cy="200" r="1.5"/><circle cx="495" cy="200" r="1.5"/><circle cx="505" cy="200" r="1.5"/>
      <circle cx="485" cy="216" r="1.5"/><circle cx="495" cy="216" r="1.5"/><circle cx="505" cy="216" r="1.5"/>
      <circle cx="485" cy="232" r="1.5"/><circle cx="495" cy="232" r="1.5"/><circle cx="505" cy="232" r="1.5"/>
    </g>

    <!-- Handle Controls: Slider Power Switch & Cold Shot Button -->
    <rect x="330" y="202" width="20" height="28" rx="4" fill="#0f172a"/>
    <circle cx="340" cy="210" r="3" fill="#38bdf8"/> <!-- Cold Shot blue dot -->
    <circle cx="370" cy="216" r="5" fill="#ef4444"/> <!-- Heat control -->

    <!-- Quick-Release Collar (Iconic Dyson Copper) -->
    <rect x="250" y="186" width="30" height="60" rx="8" fill="url(#awCopper)" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Coanda 30mm Bi-Directional Airwrap Barrel (Rotatable Top Cool Tip) -->
    <rect x="110" y="196" width="140" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Coanda Aerodynamic Airflow Slits -->
    <g stroke="url(#awCopper)" stroke-width="2.5" stroke-linecap="round">
      <line x1="125" y1="202" x2="235" y2="202"/>
      <line x1="125" y1="216" x2="235" y2="216"/>
      <line x1="125" y1="230" x2="235" y2="230"/>
    </g>
    <!-- Rotating Cool Tip with Direction Arrow -->
    <path d="M 110,190 L 80,205 C 72,216 72,216 80,227 L 110,242 Z" fill="url(#awCopper)" stroke="#9a3412" stroke-width="1.5"/>
    <circle cx="95" cy="216" r="4" fill="#ffffff"/>
  </g>
</svg>