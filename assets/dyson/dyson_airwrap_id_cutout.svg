<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="airwrapIdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="ceramicPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="strawberryBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <g filter="url(#airwrapIdShadow)">
    <!-- Main Handle in Matte Ceramic Pink -->
    <rect x="280" y="190" width="220" height="52" rx="14" fill="url(#ceramicPink)" stroke="#be185d" stroke-width="2"/>
    
    <!-- Filter Base with Bluetooth Wireless Indicator -->
    <rect x="470" y="185" width="45" height="62" rx="10" fill="#831843" stroke="#500724" stroke-width="2"/>
    <!-- Bluetooth Sync LED icon -->
    <circle cx="492" cy="216" r="4" fill="#38bdf8"/>

    <!-- Digital i.d. One-Touch Auto-Wrap Button -->
    <rect x="330" y="200" width="24" height="32" rx="5" fill="#500724"/>
    <circle cx="342" cy="216" r="5" fill="#f43f5e"/>

    <!-- Strawberry Bronze Quick-Release Collar -->
    <rect x="250" y="186" width="30" height="60" rx="8" fill="url(#strawberryBronze)" stroke="#7f1d1d" stroke-width="1.5"/>

    <!-- Conical Barrel for tighter curls at roots -->
    <polygon points="100,202 250,196 250,236 100,230" fill="#500724" stroke="#831843" stroke-width="2"/>
    <!-- Bi-Directional Coanda Air Slots -->
    <g stroke="url(#strawberryBronze)" stroke-width="2.5" stroke-linecap="round">
      <line x1="120" y1="208" x2="235" y2="204"/>
      <line x1="120" y1="216" x2="235" y2="216"/>
      <line x1="120" y1="224" x2="235" y2="228"/>
    </g>
    <!-- Rotatable Cool Tip -->
    <path d="M 100,194 L 75,206 C 68,216 68,216 75,226 L 100,238 Z" fill="url(#strawberryBronze)" stroke="#7f1d1d" stroke-width="1.5"/>
  </g>
</svg>