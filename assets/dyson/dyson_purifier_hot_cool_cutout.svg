<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <filter id="hp07Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="hp07Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <g filter="url(#hp07Shadow)">
    <!-- Swivel Base -->
    <ellipse cx="250" cy="640" rx="75" ry="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Lower Mesh Filter Body -->
    <rect x="185" y="390" width="130" height="240" rx="20" fill="url(#hp07Body)" stroke="#94a3b8" stroke-width="2"/>
    <!-- 360 Micro Perforation Filter Grille -->
    <g fill="#64748b" opacity="0.5">
      <circle cx="205" cy="450" r="1.8"/><circle cx="225" cy="450" r="1.8"/><circle cx="245" cy="450" r="1.8"/><circle cx="265" cy="450" r="1.8"/><circle cx="285" cy="450" r="1.8"/>
      <circle cx="205" cy="480" r="1.8"/><circle cx="225" cy="480" r="1.8"/><circle cx="245" cy="480" r="1.8"/><circle cx="265" cy="480" r="1.8"/><circle cx="285" cy="480" r="1.8"/>
      <circle cx="205" cy="510" r="1.8"/><circle cx="225" cy="510" r="1.8"/><circle cx="245" cy="510" r="1.8"/><circle cx="265" cy="510" r="1.8"/><circle cx="285" cy="510" r="1.8"/>
      <circle cx="205" cy="540" r="1.8"/><circle cx="225" cy="540" r="1.8"/><circle cx="245" cy="540" r="1.8"/><circle cx="265" cy="540" r="1.8"/><circle cx="285" cy="540" r="1.8"/>
      <circle cx="205" cy="570" r="1.8"/><circle cx="225" cy="570" r="1.8"/><circle cx="245" cy="570" r="1.8"/><circle cx="265" cy="570" r="1.8"/><circle cx="285" cy="570" r="1.8"/>
    </g>
    <!-- LCD Circular Display -->
    <circle cx="250" cy="415" r="14" fill="#020617" stroke="#22c55e" stroke-width="1.8"/>
    <text x="250" y="418" font-family="'Courier New', monospace" font-size="7.5" font-weight="900" fill="#ef4444" text-anchor="middle">24°C</text>

    <!-- Upper Bladeless Loop Amplifier (Oval Loop Fan Heater) -->
    <path d="M 195,110 C 195,60 305,60 305,110 L 305,390 L 195,390 Z" fill="none" stroke="url(#hp07Body)" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="250" cy="85" rx="42" ry="18" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="238" y="95" width="24" height="280" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Magnetized Remote Control docked on top -->
    <rect x="236" y="55" width="28" height="10" rx="3" fill="#64748b" stroke="#334155" stroke-width="1"/>
  </g>
</svg>