<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="deskNickel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <g filter="url(#deskShadow)">
    <!-- Desk Weighted Base -->
    <ellipse cx="280" cy="450" rx="75" ry="18" fill="url(#deskNickel)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="280" cy="447" rx="68" ry="14" fill="#f8fafc"/>
    <circle cx="280" cy="447" r="12" fill="#334155"/>

    <!-- Desk Stem Column -->
    <rect x="273" y="180" width="14" height="265" rx="7" fill="url(#deskNickel)" stroke="#64748b" stroke-width="1.2"/>
    <!-- Micro-Perforation Ambient Column Glow -->
    <line x1="280" y1="200" x2="280" y2="430" stroke="#f59e0b" stroke-width="4" stroke-dasharray="2,5" opacity="0.6"/>

    <!-- 3-Way Pivot Joint -->
    <circle cx="280" cy="180" r="16" fill="url(#deskNickel)" stroke="#475569" stroke-width="2"/>
    <circle cx="280" cy="180" r="7" fill="#1e293b"/>

    <!-- Horizontal Arm to Light Engine -->
    <path d="M 280,180 L 130,135" stroke="url(#deskNickel)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="130" cy="135" r="12" fill="#334155"/>

    <!-- Compact Light Engine Head -->
    <rect x="95" y="122" width="38" height="26" rx="5" fill="url(#deskNickel)" stroke="#475569" stroke-width="1.2"/>
    <ellipse cx="114" cy="148" rx="15" ry="6" fill="#fef08a" stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Daylight Simulation Ambient Beam -->
    <polygon points="100,148 128,148 160,260 70,260" fill="url(#warmAmberLight)"/>
  </g>
</svg>