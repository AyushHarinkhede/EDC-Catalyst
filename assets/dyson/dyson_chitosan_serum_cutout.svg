<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <filter id="serumShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.32" flood-color="#000000"/>
    </filter>
    <linearGradient id="serumBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <g filter="url(#serumShadow)">
    <ellipse cx="200" cy="540" rx="80" ry="18" fill="#cbd5e1" opacity="0.6"/>

    <!-- Matte Dark Blue Sculptural Dispenser Body -->
    <path d="M 140,240 C 130,320 125,440 135,520 C 145,540 255,540 265,520 C 275,440 270,320 260,240 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Precision Dispenser Pump Top with Chrome Blue Accent -->
    <rect x="155" y="160" width="90" height="80" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 200,160 L 200,110 C 200,95 170,95 155,105 L 140,115" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>
    <circle cx="138" cy="116" r="6" fill="url(#serumBlue)"/>

    <!-- Official Inscriptions -->
    <text x="200" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">dyson</text>
    <text x="200" y="355" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CHITOSAN™</text>
    <text x="200" y="385" font-family="'DM Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">POST-STYLE SERUM</text>
    <text x="200" y="415" font-family="'DM Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">HIGH GLOSS · ANTI-FRIZZ · 100ML</text>
  </g>
</svg>