<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="alShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="14" stdDeviation="10" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <linearGradient id="aluminumGraphite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="alClip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="translucentGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(30,41,59,0.85)"/>
      <stop offset="50%" stop-color="rgba(71,85,105,0.7)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.9)"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-35 300 300)" filter="url(#alShadow)">
    <rect x="285" y="220" width="32" height="240" rx="6" fill="url(#aluminumGraphite)"/>
    <rect x="295" y="235" width="12" height="28" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect x="297" y="242" width="8" height="16" rx="1.5" fill="#38bdf8" opacity="0.85"/>
    <line x1="292" y1="220" x2="292" y2="455" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <line x1="310" y1="220" x2="310" y2="455" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>

    <polygon points="285,220 289,165 313,165 317,220" fill="url(#translucentGrip)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="301" y1="165" x2="301" y2="220" stroke="#0284c7" stroke-width="3" opacity="0.6"/>

    <rect x="284" y="217" width="34" height="4" rx="1" fill="url(#alClip)"/>

    <path d="M291,165 L297,120 Q301,112 305,120 L311,165 Z" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
    <circle cx="301" cy="136" r="1.8" fill="#0284c7"/>
    <line x1="301" y1="115" x2="301" y2="136" stroke="#0284c7" stroke-width="1"/>
    <text x="301" y="152" font-family="sans-serif" font-size="5" font-weight="bold" text-anchor="middle" fill="#94a3b8">LAMY</text>

    <g transform="translate(-75, -28)">
      <rect x="365" y="130" width="34" height="170" rx="7" fill="url(#aluminumGraphite)"/>
      <path d="M365,135 Q382,126 399,135 Z" fill="#0f172a"/>
      <path d="M377,145 L377,260 Q377,275 382,275 Q387,275 387,260 L387,145" 
            fill="none" stroke="url(#alClip)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="382" y="293" font-family="'Montserrat', sans-serif" font-style="italic" font-size="8" font-weight="900" text-anchor="middle" fill="rgba(255,255,255,0.4)">LAMY</text>
    </g>
  </g>
</svg>