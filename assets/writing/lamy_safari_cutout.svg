<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="safariShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="14" stdDeviation="10" flood-opacity="0.38" flood-color="#000000"/>
    </filter>
    <linearGradient id="safariBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="35%" stop-color="#181818"/>
      <stop offset="70%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="clipChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="nibSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="85%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-35 300 300)" filter="url(#safariShadow)">
    <!-- Pen Barrel -->
    <rect x="285" y="220" width="30" height="240" rx="6" fill="url(#safariBody)"/>
    <!-- Ink Window -->
    <rect x="294" y="235" width="12" height="28" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="296" y="242" width="8" height="16" rx="1.5" fill="#0284c7" opacity="0.8"/>

    <!-- Ergonomic Safari Facets -->
    <line x1="291" y1="220" x2="291" y2="455" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <line x1="309" y1="220" x2="309" y2="455" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>

    <!-- Bottom Cap -->
    <path d="M285,455 Q300,465 315,455 L315,462 Q300,470 285,462 Z" fill="#0f0f0f"/>

    <!-- Triangular Grip Section -->
    <polygon points="285,220 289,165 311,165 315,220" fill="#1c1c1c"/>
    <line x1="297" y1="165" x2="295" y2="220" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <line x1="303" y1="165" x2="305" y2="220" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>

    <!-- Chrome Joint Ring -->
    <rect x="284" y="217" width="32" height="4" rx="1" fill="url(#clipChrome)"/>

    <!-- Feed & Nib -->
    <path d="M290,165 L296,120 Q300,112 304,120 L310,165 Z" fill="url(#nibSteel)" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="300" cy="136" r="1.8" fill="#111111"/>
    <line x1="300" y1="115" x2="300" y2="136" stroke="#111111" stroke-width="1"/>
    <text x="300" y="152" font-family="sans-serif" font-size="5" font-weight="bold" text-anchor="middle" fill="#333333">LAMY</text>
    <text x="300" y="159" font-family="sans-serif" font-size="4" text-anchor="middle" fill="#555555">M</text>

    <!-- Safari Cap -->
    <g transform="translate(-75, -28)">
      <rect x="365" y="130" width="32" height="170" rx="7" fill="url(#safariBody)"/>
      <path d="M365,135 Q381,126 397,135 Z" fill="#080808"/>
      <circle cx="381" cy="131" r="3.5" fill="#151515"/>
      <!-- Safari Iconic Wire Clip -->
      <path d="M376,145 L376,260 Q376,275 381,275 Q386,275 386,260 L386,145" 
            fill="none" stroke="url(#clipChrome)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="381" y="293" font-family="'Montserrat', sans-serif" font-style="italic" font-size="8" font-weight="900" text-anchor="middle" fill="rgba(255,255,255,0.25)" letter-spacing="1">LAMY</text>
    </g>
  </g>
</svg>